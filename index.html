<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brúixola 3D Sòlida - Cilindre Real</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e8e8e8;
            overflow: hidden;
            font-family: sans-serif;
        }

        .scene {
            width: 400px;
            height: 400px;
            perspective: 1500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El contenidor que gira */
        .compass-3d {
            width: 280px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            animation: girar 7s linear infinite;
            transform: rotateY(0deg);
        }

        /* --- LA CARA FRONTAL (L'esfera de la brúixola) --- */
        .face-front {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-image: url('https://i.imgur.com/8YwJ5wT.png'); 
            background-size: cover;
            background-position: center;
            border: 4px solid #d4af37;
            box-sizing: border-box;
            transform: translateZ(20px);
            backface-visibility: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            z-index: 100;
        }

        /* Efecte de vidre */
        .glass-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.2) 100%);
            transform: translateZ(21px);
            pointer-events: none;
            z-index: 101;
        }

        /* --- LA CARA POSTERIOR (El revers sòlid daurat) --- */
        .face-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 60% 40%, #fceabb, #d4af37, #b8860b, #6b4c05);
            border: 4px solid #b8860b;
            box-sizing: border-box;
            transform: rotateY(180deg) translateZ(20px);
            backface-visibility: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
            z-index: 99;
        }

        /* --- EL COS CENTRAL (El cilindre massís) --- */
        /* Creem una pila de capes fines per simular el volum */
        .cylinder-stack {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            pointer-events: none;
            z-index: 1;
        }

        /* Generem automàticament 30 capes amb JavaScript per no escriure 30 línies */
        /* Això crea l'efecte de "cos massís" */

        /* --- LA NANSA --- */
        .handle {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            width: 30px;
            height: 30px;
            border: 5px solid #d4af37;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            background: transparent;
            z-index: 0;
        }

        @keyframes girar {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="compass-3d" id="compass">
            <!-- El cos central s'omplirà amb JavaScript -->
            <div class="cylinder-stack" id="stack"></div>
            
            <!-- La cara frontal de la brúixola -->
            <div class="face-front"></div>
            
            <!-- El reflex de vidre -->
            <div class="glass-overlay"></div>
            
            <!-- El revers sòlid daurat -->
            <div class="face-back"></div>
            
            <!-- La nansa superior -->
            <div class="handle"></div>
        </div>
    </div>

    <script>
        // Generem 30 capes de discos per crear el volum del cilindre
        const stack = document.getElementById('stack');
        const totalCapes = 30;
        const gruixTotal = 40; // px de profunditat total (de -20 a +20)
        
        for (let i = 0; i < totalCapes; i++) {
            const layer = document.createElement('div');
            // Calculem la posició Z de cada capa
            const zPos = -20 + (i * (gruixTotal / (totalCapes - 1)));
            
            // Estil de cada capa
            layer.style.position = 'absolute';
            layer.style.width = '100%';
            layer.style.height = '100%';
            layer.style.borderRadius = '50%';
            layer.style.transform = `translateZ(${zPos}px)`;
            
            // El color: degradat daurat fosc per donar sensació de metall polit
            layer.style.background = `radial-gradient(circle at 40% 40%, 
                #fceabb 0%, 
                #d4af37 30%, 
                #b8860b 60%, 
                #8b6508 100%)`;
            
            // Posem una vora fosca per accentuar el volum
            layer.style.boxShadow = 'inset 0 0 15px rgba(0,0,0,0.8)';
            
            // Afegim la capa al contenidor
            stack.appendChild(layer);
        }
    </script>

</body>
</html>
