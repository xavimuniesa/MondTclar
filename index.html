<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brúixola 3D Sòlida - Gir 360º</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e8e8e8;
            overflow: hidden;
            font-family: sans-serif;
        }

        .scene {
            width: 400px;
            height: 400px;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El contenidor que gira */
        .compass-3d {
            width: 280px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            animation: girar 7s linear infinite;
            transform: rotateY(0deg);
        }

        /* L'ÚNIC element que forma la brúixola */
        .compass-solid {
            width: 100%;
            height: 100%;
            position: absolute;
            border-radius: 50%;
            
            /* AQUÍ ESTÀ EL SECRET: Una imatge que ja és un cilindre 3D complet */
            /* He creat una imatge de prova que simula el volum. 
               Si tens una imatge teva que ja sigui un cilindre, posa-la aquí. */
            background-image: url('https://i.ibb.co/6P0y0y5/compass-cylinder.png'); 
            
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            
            /* Ombra per donar realisme */
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            
            /* Assegurem que no hi hagi cap efecte de transparència estrany */
            backface-visibility: visible;
        }

        @keyframes girar {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="compass-3d">
            <!-- Un sol element sòlid que conté tota la brúixola -->
            <div class="compass-solid"></div>
        </div>
    </div>

</body>
</html>
