<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOSTOV</title>
<meta name="description" content="Rellotge automàtic de busseig amb calendari de festius de Barcelona i el temps local.">
<meta name="theme-color" content="#060607">
<!-- App instal·lable -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KOSTOV">
<script>(function(){var m='auto';try{m=localStorage.getItem('kostovTheme')||'auto'}catch(e){}var h=new Date().getHours()+new Date().getMinutes()/60;document.documentElement.dataset.theme=m==='auto'?((h>=7.5&&h<19.5)?'day':'night'):m;})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Russo+One&family=Saira:wdth,wght@125,600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
/* ================= Temes: nit (per defecte) i dia ================= */
:root, html[data-theme="night"]{
  --page:#030304;
  --body-bg:radial-gradient(120% 90% at 30% 40%, #121315 0%, #08080a 55%, #020203 100%);
  --panel:#0b0c0e; --panel2:#101113; --line:#222428;
  --ink:#dcdfe0; --ink2:#9a9ea3; --ink3:#5c6065;
  --accent:#dfe8b2; --accent-glow:0 0 16px rgba(214,236,150,.5);
  --lume:#dfe8b2; --lume-hi:#f5f8e2; --lume-lo:#a9b67a; --glow:rgba(214,236,150,.55);
  --red:#e3201b; --hol-ink:#ff4b43; --hol-bg:radial-gradient(circle at 50% 40%, rgba(227,32,27,.28), rgba(227,32,27,.10));
  --cell-bg:#131417; --cell-bd:#1d1f22; --out-ink:#3c3f44;
  --sat-bg:linear-gradient(160deg,#3a3d41,#26282b); --sat-ink:#c9ccd0; --sat-bd:#45484d;
  --sun-bg:linear-gradient(160deg,#8e9195,#6c6f73); --sun-ink:#0b0b0c; --sun-bd:#a3a6aa;
  --today-bd:#f3f7da; --today-ink:#0a0b08; --today-glow:0 0 18px rgba(214,236,150,.55), 0 0 42px rgba(214,236,150,.28);
  --shadow:0 18px 36px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  --btn-bg:#16171a; --btn-bd:#2a2c30; --btn-ink:#c9ccd0; --btn-on:#dfe8b2; --btn-on-ink:#0b0c08;
  --pop-bg:linear-gradient(180deg,#1b1c1f,#0e0f11); --pop-bd:#3a2020; --pop-tip:#131416;
  --ico-a:#dfe8b2;
  --alert-bg:linear-gradient(180deg,#1c2114,#12150d); --alert-bd:#56633a; --alert-ink:#e6f2b8; --alert-lbl:#b9c98a;
  --card-shadow:0 8px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
  color-scheme:dark;
}
html[data-theme="day"]{
  --page:#d9dad5;
  --body-bg:radial-gradient(120% 90% at 30% 35%, #fbfbf8 0%, #e7e8e3 50%, #cdcfc9 100%);
  --panel:#f0f1ed; --panel2:#fafaf8; --line:#d3d5cf;
  --ink:#17181a; --ink2:#55595f; --ink3:#8a8e93;
  --accent:#55701a; --accent-glow:none;
  --lume:#dfe8b2; --lume-hi:#f7faea; --lume-lo:#b4c27f; --glow:rgba(150,175,70,.35);
  --hol-ink:#cf150e; --hol-bg:radial-gradient(circle at 50% 40%, rgba(227,32,27,.14), rgba(227,32,27,.05));
  --cell-bg:#e8e9e4; --cell-bd:#d6d8d2; --out-ink:#b5b8b3;
  --sat-bg:linear-gradient(160deg,#cfd1d3,#bbbec1); --sat-ink:#1d1e20; --sat-bd:#aeb1b4;
  --sun-bg:linear-gradient(160deg,#6f7276,#55585c); --sun-ink:#f4f5f2; --sun-bd:#4a4d51;
  --today-bd:#8b9c50; --today-ink:#1b1d10; --today-glow:0 0 0 3px rgba(139,156,80,.25), 0 6px 16px rgba(110,130,40,.35);
  --shadow:0 14px 30px rgba(60,60,45,.16), inset 0 1px 0 rgba(255,255,255,.8);
  --btn-bg:#e6e7e2; --btn-bd:#cfd1cb; --btn-ink:#3b3e43; --btn-on:#1b1c1e; --btn-on-ink:#f3f4ef;
  --pop-bg:linear-gradient(180deg,#ffffff,#f1f1ed); --pop-bd:#e8c9c7; --pop-tip:#f6f6f3;
  --ico-a:#6f8a2a;
  --alert-bg:linear-gradient(180deg,#f2f6dc,#e4ebc2); --alert-bd:#a9b86c; --alert-ink:#3c4d0e; --alert-lbl:#5d6e26;
  --card-shadow:0 5px 12px rgba(60,60,45,.12), inset 0 1px 0 rgba(255,255,255,.8);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--page); transition:background-color .6s}
html,body{min-height:100%}
body{
  background:var(--body-bg) fixed;
  color:var(--ink); font-family:Barlow,system-ui,sans-serif;
  min-height:100vh; min-height:100svh; overflow-x:hidden;
  transition:color .6s;
}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
button:focus-visible{outline:2px solid var(--lume-lo); outline-offset:2px}
/* ---------------- composició: 50 % esfera · 50 % calendari, dades i comandaments ---------------- */
.wrap{
  --pad:clamp(14px,3vh,40px);
  --S:min(40vw, calc(100vh - 2*var(--pad)));
  --S:min(40vw, calc(100svh - 2*var(--pad)));
  min-height:100vh; min-height:100svh; display:grid; grid-template-columns:1fr 1fr;
  align-items:center; justify-items:center; column-gap:0;
  padding:max(var(--pad), env(safe-area-inset-top)) env(safe-area-inset-right) max(var(--pad), env(safe-area-inset-bottom)) env(safe-area-inset-left);
}

/* ---------------- rellotge ---------------- */
.watch{position:relative; width:var(--S); aspect-ratio:1/1}
.watch svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
#baseLayer,#bBase,.lyr-bezel{transition:filter .8s ease}
.lyr-glow{pointer-events:none; opacity:0; transition:opacity .8s ease}
.lyr-bezel{pointer-events:none}
.bezel-hit{pointer-events:all; cursor:grab}
.lyr-bezel.drag .bezel-hit{cursor:grabbing}
#bezelLayer.drag{cursor:grabbing}
.lyr-hands{pointer-events:none}
/* gir 3D: dues cares i capes de gruix (cilindre tancat) */
.watch{cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent}
.watch:focus-visible{outline:2px solid var(--lume-lo); outline-offset:6px; border-radius:50%}
.flip{position:absolute; inset:0; transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
      transition:transform 8s cubic-bezier(.45,.05,.55,.95)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden}
.edge{position:absolute; inset:2.9%; border-radius:50%; pointer-events:none}
#glass,#glassB{transition:opacity .8s}
html[data-theme="night"] #baseLayer, html[data-theme="night"] #bBase, html[data-theme="night"] .lyr-bezel{filter:brightness(.5) saturate(.85)}
html[data-theme="night"] .lyr-glow{opacity:1}
html[data-theme="night"] #glass, html[data-theme="night"] #glassB{opacity:.35}
html[data-theme="day"] #baseLayer, html[data-theme="day"] #bBase, html[data-theme="day"] .lyr-bezel{filter:brightness(1.06)}

/* ---------------- columna dreta: barra de comandaments + roda (mateixa mida que l'esfera) ---------------- */
.side{position:relative; width:var(--S); height:var(--S); display:flex; flex-direction:column; gap:10px; min-width:0}
.bar{display:flex; align-items:center; gap:8px; height:44px; flex:none}
.ins-btn{height:36px; min-width:58px; padding:0 14px; border-radius:999px; font-family:"Barlow Condensed"; font-weight:700; font-size:16px; letter-spacing:.14em;
  color:#0d1006; background:radial-gradient(circle at 40% 35%, #f6fbe0, #dfe8b2 55%, #b9c787);
  box-shadow:0 0 0 1px rgba(255,255,255,.35) inset, 0 0 14px rgba(214,236,150,.75), 0 0 34px rgba(214,236,150,.35);
  text-shadow:0 1px 0 rgba(255,255,255,.4); animation:insGlow 3.2s ease-in-out infinite}
@keyframes insGlow{50%{box-shadow:0 0 0 1px rgba(255,255,255,.35) inset, 0 0 22px rgba(214,236,150,.95), 0 0 48px rgba(214,236,150,.45)}}
.ins-btn[hidden]{display:none}
.icon-btn{width:38px; height:38px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--btn-bg); border:1px solid var(--btn-bd); color:var(--btn-ink); transition:background .25s,color .25s}
.icon-btn svg{width:19px; height:19px}
.icon-btn[aria-pressed="true"]{background:var(--btn-on); color:var(--btn-on-ink)}
.icon-btn.spinning svg{animation:spin 8s cubic-bezier(.45,.05,.55,.95)}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:inline-flex; gap:2px; padding:3px; margin-left:auto; border-radius:999px; background:var(--btn-bg); border:1px solid var(--btn-bd)}
.seg button{display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 11px; border-radius:999px; font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--btn-ink); transition:background .25s,color .25s}
.seg button svg{width:15px; height:15px}
.seg button[aria-pressed="true"]{background:var(--btn-on); color:var(--btn-on-ink)}
.ios-hint{position:absolute; z-index:20; left:0; right:0; top:52px; font-size:13px; line-height:1.45; color:var(--ink); padding:11px 14px; border-radius:14px;
  background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); box-shadow:0 16px 34px rgba(0,0,0,.4)}
.ios-hint svg{width:15px; height:15px; vertical-align:-2px; color:var(--accent)}
.ios-hint[hidden]{display:none}

/* ---------------- la roda: un tambor 3D dins el quadre ---------------- */
.wheel{position:relative; flex:1; min-height:0; border-radius:18px; overflow:hidden; outline:none; touch-action:none;
  container-type:size; background:var(--page); box-shadow:var(--shadow); -webkit-tap-highlight-color:transparent}
.wheel:focus-visible{outline:2px solid var(--lume-lo); outline-offset:3px}
.drum{position:absolute; inset:0; transform-style:preserve-3d; -webkit-transform-style:preserve-3d; transition:transform .75s cubic-bezier(.3,.75,.2,1)}
.wface{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden;
  border-radius:18px; border:1px solid var(--line); background:linear-gradient(180deg,var(--panel2),var(--panel));
  padding:2.6cqh 3.2cqw 6cqh; display:flex; flex-direction:column}
.wface:not(.on){pointer-events:none}
.wface .shade{position:absolute; inset:0; pointer-events:none; background:#000; opacity:0; transition:opacity .75s}
.wdots{position:absolute; z-index:6; left:50%; bottom:1.6cqh; transform:translateX(-50%); display:flex; gap:6px; pointer-events:none}
.wdots i{width:6px; height:6px; border-radius:50%; background:var(--line); transition:background .3s, transform .3s}
.wdots i.on{background:var(--lume-lo); transform:scale(1.3)}
.wdots i.al1{background:#f2c200} .wdots i.al2{background:#ff7a00} .wdots i.al3{background:#e3201b; animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(227,32,27,.25)}}

/* capçalera de cada cara de dades */
.fhead{display:flex; align-items:baseline; justify-content:space-between; gap:8px; height:9cqh; flex:none; border-bottom:1px solid var(--line); margin-bottom:3cqh}
.ftitle{font-family:"Barlow Condensed"; font-weight:700; font-size:clamp(15px,6cqh,30px); letter-spacing:.08em; text-transform:uppercase}
.fsub{font-size:clamp(11px,3.4cqh,16px); color:var(--ink2); letter-spacing:.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fbody{flex:1; min-height:0; display:flex; flex-direction:column; gap:3cqh}
.hero{display:flex; align-items:center; gap:4cqw; flex:1; min-height:0}
.hero-ico{height:min(30cqh,34cqw); aspect-ratio:1; flex:none}
.hero-ico svg{width:100%; height:100%}
.hero-t{font-family:"Barlow Condensed"; font-weight:600; font-size:clamp(28px,20cqh,110px); line-height:.9; color:var(--accent); text-shadow:var(--accent-glow)}
.hero-big{font-family:"Barlow Condensed"; font-weight:700; font-size:clamp(22px,12cqh,72px); line-height:1; letter-spacing:.02em}
.hero-d{font-size:clamp(13px,4.6cqh,24px); color:var(--ink2); margin-top:1cqh}
.kv4{display:grid; grid-template-columns:1fr 1fr; gap:2.4cqh 3cqw; flex:none}
.kv{display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:2.4cqw; align-items:center;
  padding:1.8cqh 2.4cqw; border-radius:12px; background:var(--cell-bg); border:1px solid var(--cell-bd)}
.kv svg{grid-row:1 / span 2; width:clamp(18px,7cqh,36px); height:clamp(18px,7cqh,36px); color:var(--ink2)}
.kv b{font-family:"Barlow Condensed"; font-weight:600; font-size:clamp(17px,7.4cqh,40px); line-height:1}
.kv span{font-size:clamp(9px,2.7cqh,13px); font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2)}

/* previsió: files grans, només si està previst */
.frow{display:flex; align-items:center; gap:4cqw; padding:2.4cqh 3cqw; border-radius:14px; flex:1; max-height:26cqh;
  background:var(--alert-bg); border:1px solid var(--alert-bd)}
.frow svg{height:min(11cqh,16cqw); width:auto; flex:none}
.frow b{font-family:"Barlow Condensed"; font-weight:700; font-size:clamp(20px,10cqh,58px); line-height:1; color:var(--alert-ink)}
.frow .fr-t{display:flex; flex-direction:column; gap:.6cqh}
.frow .fr-l{font-size:clamp(11px,3.6cqh,18px); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--alert-lbl)}
.frow .fr-s{font-size:clamp(11px,3.4cqh,16px); color:var(--alert-lbl); opacity:.85}
.calm{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2cqh; text-align:center; color:var(--ink2);
  font-size:clamp(13px,4.4cqh,22px); padding:0 6cqw}
.calm svg{width:min(22cqh,30cqw); height:auto; color:var(--accent)}

/* avisos: colors d'emergència */
.wface.alerts.active{background:linear-gradient(180deg,#2a0d0b,#160605); border-color:#7a1712}
html[data-theme="day"] .wface.alerts.active{background:linear-gradient(180deg,#fff4ec,#ffe6d6); border-color:#f0a07a}
.wface.alerts.active .ftitle{color:#ff5a3c}
html[data-theme="day"] .wface.alerts.active .ftitle{color:#c4200f}
.alist{display:flex; flex-direction:column; gap:2cqh; flex:1; min-height:0; overflow:hidden}
.al{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:3cqw; padding:2cqh 3cqw; border-radius:12px;
  color:#170800; position:relative; overflow:hidden}
.al::before{content:""; position:absolute; left:0; top:0; bottom:0; width:1.6cqw; min-width:6px;
  background:repeating-linear-gradient(45deg,#111 0 6px,transparent 6px 12px)}
.al svg{height:min(9cqh,13cqw); width:auto; margin-left:1.2cqw}
.al b{display:block; font-family:"Barlow Condensed"; font-weight:700; font-size:clamp(16px,6.4cqh,34px); line-height:1}
.al small{display:block; font-size:clamp(11px,3.3cqh,16px); margin-top:.5cqh; opacity:.9}
.al em{font-style:normal; font-family:"Barlow Condensed"; font-weight:700; font-size:clamp(11px,3.4cqh,17px); letter-spacing:.1em; text-transform:uppercase;
  padding:.6cqh 2cqw; border-radius:999px; background:rgba(0,0,0,.18)}
.al.l1{background:linear-gradient(180deg,#ffd84a,#f2c200)}
.al.l2{background:linear-gradient(180deg,#ffa040,#ff7a00)}
.al.l3{background:linear-gradient(180deg,#ff4a3c,#d4140c); color:#fff; animation:alarm 1.6s ease-in-out infinite}
.al.l3::before{background:repeating-linear-gradient(45deg,#fff 0 6px,transparent 6px 12px); opacity:.7}
.al.l3 em{background:rgba(255,255,255,.22)}
@keyframes alarm{50%{box-shadow:0 0 0 3px rgba(255,74,60,.35), 0 0 22px rgba(255,74,60,.5)}}
.al-src{flex:none; font-size:clamp(9px,2.5cqh,12px); color:var(--ink3); margin-top:1cqh}
.wface.alerts.active .al-src{color:#c98b80}

/* ---------------- calendari (cara 1 de la roda) ---------------- */
.cal-head{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:1.4cqh; height:max(34px,9cqh); flex:none}
.cal-title{display:flex; align-items:baseline; gap:8px; min-width:0; padding:2px 4px; margin-left:-4px; border-radius:8px; user-select:none}
.cal-month{font-family:"Barlow Condensed"; font-weight:700; font-size:clamp(17px,6.4cqh,32px); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.cal-year{font-family:"Barlow Condensed"; font-weight:500; font-size:clamp(13px,4.6cqh,24px); color:var(--ink2); letter-spacing:.1em}
.cal-nav{display:flex; align-items:center; gap:4px; flex:none}
.nav-btn{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--btn-bg); border:1px solid var(--btn-bd); color:var(--btn-ink)}
.nav-btn svg{width:14px; height:14px}
.today-btn{height:30px; padding:0 10px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  background:var(--lume); color:#14160b; box-shadow:0 0 10px var(--glow); transition:opacity .2s, transform .2s}
.today-btn[hidden]{display:inline-block; visibility:hidden; opacity:0; transform:scale(.9)}
.grid{flex:1; min-height:0; display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:auto repeat(6, minmax(0,1fr)); gap:.9cqh 4px}
.dow{font-size:clamp(9px,3cqh,14px); font-weight:600; letter-spacing:.1em; text-align:center; color:var(--ink2); padding:2px 0 4px; text-transform:uppercase}
.dow.we{color:var(--ink3)}
.day{
  position:relative; height:100%; max-width:100%; justify-self:center; align-self:center; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  border-radius:50%; font-family:"Barlow Condensed"; font-weight:600; font-size:clamp(12px,4.6cqh,24px);
  color:var(--ink); background:var(--cell-bg); border:1px solid var(--cell-bd);
}
.day.out{background:none; border-color:transparent; color:var(--out-ink); font-weight:500}
.day.sat{background:var(--sat-bg); color:var(--sat-ink); border-color:var(--sat-bd)}
.day.sun{background:var(--sun-bg); color:var(--sun-ink); border-color:var(--sun-bd)}
.day.hol{color:var(--hol-ink); background:var(--hol-bg); border:1.5px solid var(--red); box-shadow:0 0 9px rgba(227,32,27,.3)}
.day.hol.sun{background:radial-gradient(circle at 50% 40%, rgba(227,32,27,.30), rgba(80,10,8,.5))}
html[data-theme="day"] .day.hol.sun{background:radial-gradient(circle at 50% 40%, rgba(227,32,27,.18), rgba(227,32,27,.30)); color:#a50f0a}
.day.today{
  background:radial-gradient(circle at 38% 34%, var(--lume-hi), var(--lume) 55%, var(--lume-lo));
  color:var(--today-ink); border:2px solid var(--today-bd); box-shadow:var(--today-glow);
}
.day.today.hol{border:3px solid var(--red); color:#b3140f}
.day.hol{cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none}
.day.hol:focus-visible{outline:2px solid var(--lume); outline-offset:2px}
.day.hol.open{transform:scale(1.08); transition:transform .15s}

/* finestreta del festiu */
.pop{
  position:absolute; z-index:5; left:0; top:0; max-width:min(250px, calc(100% - 16px));
  padding:9px 12px 10px; border-radius:12px;
  background:var(--pop-bg); border:1px solid var(--pop-bd); border-left:3px solid var(--red);
  box-shadow:0 14px 30px rgba(0,0,0,.35), 0 0 14px rgba(227,32,27,.15);
  opacity:0; transform:translateY(4px) scale(.97); pointer-events:none;
  transition:opacity .16s ease, transform .16s ease;
}
.pop.show{opacity:1; transform:none}
.pop-name{font-family:"Barlow Condensed"; font-weight:700; font-size:18px; line-height:1.1; color:var(--hol-ink); letter-spacing:.02em}
.pop-date{font-size:12px; color:var(--ink); margin-top:3px}
.pop-type{font-size:10.5px; color:var(--ink2); letter-spacing:.1em; text-transform:uppercase; margin-top:4px}
.pop::after{content:""; position:absolute; left:var(--ax,50%); width:10px; height:10px; transform:translateX(-50%) rotate(45deg); background:var(--pop-tip); border:1px solid var(--pop-bd)}
.pop.up::after{bottom:-6px; border-top:none; border-left:none}
.pop.down::after{top:-6px; border-bottom:none; border-right:none}

/* ---------------- adaptació ---------------- */
/* mòbil i tauleta en vertical: l'esfera a dalt; barra i roda a sota, amb la mateixa amplada */
@media (orientation:portrait){
  .wrap{--S:min(calc(100vw - 24px), 640px); grid-template-columns:1fr; row-gap:14px; align-content:start;
        padding:max(14px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom))}
  .side{height:max(var(--S), 380px)}
}
@media (orientation:portrait) and (max-width:380px){
  .seg button{padding:0 8px}
  .icon-btn{width:34px; height:34px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main class="wrap">
  <div class="watch" id="watch" role="button" tabindex="0" aria-label="Rellotge KOSTOV. Toca per girar-lo.">
    <div class="flip" id="watchFlip">
      <div class="face front">
        <svg id="baseLayer" viewBox="-446 -446 892 892"></svg>
        <svg id="bezelLayer" class="lyr-bezel" viewBox="-446 -446 892 892"></svg>
        <svg id="glowLayer" class="lyr-glow" viewBox="-446 -446 892 892" aria-hidden="true"></svg>
        <svg id="handsLayer" class="lyr-hands" viewBox="-446 -446 892 892"></svg>
      </div>
      <div class="face back">
        <svg id="bBase" viewBox="-446 -446 892 892"></svg>
        <svg id="bBezel" class="lyr-bezel" viewBox="-446 -446 892 892"></svg>
        <svg id="bGlow" class="lyr-glow" viewBox="-446 -446 892 892" aria-hidden="true"></svg>
        <svg id="bHands" class="lyr-hands" viewBox="-446 -446 892 892"></svg>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="bar" role="toolbar" aria-label="Comandaments">
      <button type="button" class="ins-btn" id="installBtn" title="Instal·lar l'app" hidden>INS</button>
      <button type="button" class="icon-btn" id="flipBtn" aria-label="Girar l'esfera" title="Girar l'esfera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.5v5h-5"/><ellipse cx="12" cy="12" rx="2.6" ry="6" opacity=".55"/></svg>
      </button>
      <button type="button" class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="So i veu de les hores" title="So: carraca, grinyol i hores en rus">
        <svg class="snd-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.4a8 8 0 0 1 0 11.2"/></svg>
        <svg class="snd-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>
      </button>
      <div class="seg" role="group" aria-label="Aspecte de la pàgina" id="themeSeg">
        <button type="button" data-mode="auto" aria-pressed="true" title="Automàtic segons el sol">Auto</button>
        <button type="button" data-mode="day" aria-pressed="false" aria-label="Mode diürn" title="Mode diürn">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>
        </button>
        <button type="button" data-mode="night" aria-pressed="false" aria-label="Mode nocturn" title="Mode nocturn">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M10.6 1.4A6.6 6.6 0 1 0 14.6 11 5.4 5.4 0 0 1 10.6 1.4z"/></svg>
        </button>
      </div>
    </div>

    <div class="ios-hint" id="iosHint" hidden role="note"></div>

    <div class="wheel" id="wheel" tabindex="0" aria-roledescription="roda" aria-label="Calendari i dades. Llisca amunt o avall per girar la roda; doble toc per tornar al calendari.">
      <div class="drum" id="drum">
        <section class="wface cal on" aria-label="Calendari">
      <div class="cal-head">
        <button type="button" class="cal-title" id="calTitle" title="Doble toc: tornar al mes actual">
          <span class="cal-month" id="calMonth"></span><span class="cal-year" id="calYear"></span>
        </button>
        <div class="cal-nav">
          <button type="button" class="today-btn" id="calToday" hidden>Avui</button>
          <button type="button" class="nav-btn" id="calPrev" aria-label="Mes anterior"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
          <button type="button" class="nav-btn" id="calNext" aria-label="Mes següent"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></button>
        </div>
      </div>
      <div class="grid" id="calGrid"></div>
      <div class="pop" id="pop" role="status" aria-live="polite"><div class="pop-name"></div><div class="pop-date"></div><div class="pop-type"></div></div>
        </section>
        <section class="wface" id="fNow" aria-label="El temps ara"></section>
        <section class="wface" id="fPlace" aria-label="Lloc i sol"></section>
        <section class="wface" id="fFore" aria-label="Previsió de 12 hores"></section>
        <section class="wface alerts" id="fAlert" aria-label="Avisos meteorològics"></section>
      </div>
      <div class="wdots" id="wdots" aria-hidden="true"></div>
    </div>
  </div>
</main>

<script>
/* =========================================================
   Utilitats
   ========================================================= */
const NS = 'http://www.w3.org/2000/svg';
const rad = d => d * Math.PI / 180;
const P = (r, deg) => [ +(r * Math.sin(rad(deg))).toFixed(2), +(-r * Math.cos(rad(deg))).toFixed(2) ];
const LUME = '#dfe8b2';
const DOT_POS = [];
const DIAL_ONLY = true;   // sense caixa, anses ni corona de rosca (el bisell giratori sí que hi és)

/* sector d'anell (angles en graus, 0 = les 12, sentit horari) */
function ringSector(r1, r2, a1, a2){
  const [x1,y1]=P(r2,a1), [x2,y2]=P(r2,a2), [x3,y3]=P(r1,a2), [x4,y4]=P(r1,a1);
  const large = (a2-a1) > 180 ? 1 : 0;
  return `M${x1},${y1} A${r2},${r2} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${r1},${r1} 0 ${large} 0 ${x4},${y4} Z`;
}
/* rectangle arrodonit al llarg d'un radi */
function radialPill(r1, r2, w, deg, rx){
  const h = r2 - r1;
  return `<rect x="${-w/2}" y="${-r2}" width="${w}" height="${h}" rx="${rx ?? w/2}" transform="rotate(${deg})"/>`;
}

/* =========================================================
   Capa base: caixa, esfera
   ========================================================= */
function buildBase(){
  let s = `
  <defs>
    <radialGradient id="gCase" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#3a3c40"/><stop offset=".35" stop-color="#1a1b1e"/><stop offset="1" stop-color="#060607"/>
    </radialGradient>
    <linearGradient id="gLug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0b0c"/><stop offset=".45" stop-color="#2c2e31"/><stop offset=".6" stop-color="#1b1c1f"/><stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="gCrown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3c40"/><stop offset=".5" stop-color="#16171a"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="gSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#9ea1a4"/><stop offset=".55" stop-color="#f3f4f5"/><stop offset=".8" stop-color="#6d7073"/><stop offset="1" stop-color="#dfe1e3"/>
    </linearGradient>
    <radialGradient id="gDial" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#1d1e21"/><stop offset=".7" stop-color="#101113"/><stop offset="1" stop-color="#08090a"/>
    </radialGradient>
    <radialGradient id="gRehaut" cx="50%" cy="50%" r="50%">
      <stop offset=".75" stop-color="#0b0c0d"/><stop offset=".9" stop-color="#17181b"/><stop offset="1" stop-color="#0a0a0b"/>
    </radialGradient>
    <radialGradient id="gLume" cx="36%" cy="32%" r="70%">
      <stop offset="0" stop-color="#fbfdec"/><stop offset=".45" stop-color="#e1e9b6"/><stop offset="1" stop-color="#9aa86a"/>
    </radialGradient>
    <radialGradient id="gBead" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#d5d7d9"/><stop offset="1" stop-color="#5d6064"/>
    </radialGradient>
    <linearGradient id="gBevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ebec"/><stop offset=".45" stop-color="#5b5e62"/><stop offset=".7" stop-color="#c7c9cc"/><stop offset="1" stop-color="#3d4043"/>
    </linearGradient>
    <filter id="fGrain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .07 0" in="n" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gi"/></feMerge>
    </filter>
    <linearGradient id="gRimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".3" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset=".92" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <radialGradient id="gInShadowDial" cx="54%" cy="57%" r="56%">
      <stop offset=".78" stop-color="#000" stop-opacity="0"/><stop offset=".93" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </radialGradient>
    <radialGradient id="gInShadowRing" cx="53%" cy="55%" r="53%">
      <stop offset=".82" stop-color="#000" stop-opacity="0"/><stop offset=".95" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <linearGradient id="gRehautSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
    <filter id="fCaseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".75"/>
    </filter>
    <filter id="fDotShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".85"/>
    </filter>
  </defs>`;

  /* --- caixa: anses (sense corretja), barres de molla, cos, corona --- */
  if (DIAL_ONLY){
    // només l'esfera: una base fosca que li fa ombra sobre el fons
    s += `<circle r="433" fill="#050506" filter="url(#fCaseShadow)"/>`;
  } else {
  const lug = `M198,-330 L208,-470 Q211,-488 228,-490 L278,-490 Q296,-488 299,-470 L318,-330 Z`;
  s += `<g filter="url(#fCaseShadow)">`;
  // barres de molla visibles entre les anses
  s += `<rect x="-212" y="-474" width="424" height="11" rx="5.5" fill="url(#gSilver)" opacity=".55"/>`;
  s += `<rect x="-212" y="463" width="424" height="11" rx="5.5" fill="url(#gSilver)" opacity=".55"/>`;
  for (const [sx,sy] of [[1,1],[-1,1],[1,-1],[-1,-1]]){
    s += `<path d="${lug}" fill="url(#gLug)" stroke="#2c2e32" stroke-width="2" transform="scale(${sx},${sy})"/>`;
  }
  // corona hexagonal a ~2h30 (75°)
  s += `<g transform="rotate(-15)">
      <rect x="432" y="-24" width="24" height="48" rx="4" fill="#111214"/>
      <polygon points="448,-44 474,-52 500,-36 500,36 474,52 448,44" fill="url(#gCrown)" stroke="#34363a" stroke-width="2"/>
      <path d="M474,-52 L474,52" stroke="#000" stroke-width="2" opacity=".6"/>
      <path d="M454,-33 L494,-33 M454,33 L494,33" stroke="#3b3d41" stroke-width="2"/>
    </g>`;
  // cos de la caixa
  s += `<circle r="446" fill="url(#gCase)" stroke="#26282b" stroke-width="3"/>`;
  s += `</g>`;
  s += `<circle r="438" fill="none" stroke="#000" stroke-width="6" opacity=".7"/>`;
  // reflexos especulars al cantell de la caixa (llum de dalt a l'esquerra)
  s += `<circle r="443.5" fill="none" stroke="url(#gRimLight)" stroke-width="4"/>`;
  for (const [sx,sy] of [[1,1],[-1,1],[1,-1],[-1,-1]]){
    s += `<path d="M314,-350 L298,-468 Q296,-484 282,-487" fill="none" stroke="#fff" stroke-opacity="${sy<0&&sx<0?.22:.08}" stroke-width="2.5" stroke-linecap="round" transform="scale(${sx},${sy})"/>`;
  }
  }

  /* --- anell platejat interior del bisell --- */
  s += `<circle r="359" fill="url(#gSilver)"/>`;
  s += `<circle r="354" fill="#070708"/>`;

  /* --- rehaut amb escala --- */
  s += `<circle r="352" fill="url(#gRehaut)"/>`;
  s += `<circle r="347" fill="none" stroke="#a7aaad" stroke-width="1.3"/>`;
  let ticks = '';
  for (let i=0;i<300;i++){
    const a = i*1.2, isMin = i%5===0;
    const r1 = isMin ? 334 : 340;
    const [x1,y1]=P(r1,a),[x2,y2]=P(347,a);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${isMin?'#d4d6d8':'#85888c'}" stroke-width="${isMin?2:1}"/>`;
  }
  s += ticks;
  // números del rehaut 05…60
  for (let m=5;m<=60;m+=5){
    const a=m*6, [x,y]=P(323,a);
    const rot = (((a+45)%90)+90)%90-45;
    const lbl = m===60?'60':(m<10?'0'+m:''+m);
    s += `<text x="${x}" y="${y}" transform="rotate(${rot} ${x} ${y})" text-anchor="middle" dominant-baseline="central" font-family="Barlow, Arial, sans-serif" font-weight="500" font-size="20" letter-spacing="1.5" fill="#d0d3d5">${lbl}</text>`;
  }
  // escala interior fina (segons)
  s += `<circle r="309" fill="none" stroke="#5e6165" stroke-width="1"/>`;
  let fine='';
  for (let i=0;i<300;i++){
    const a=i*1.2, isMin=i%5===0;
    const [x1,y1]=P(isMin?299:302,a),[x2,y2]=P(309,a);
    fine += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${isMin?'#b9bcbf':'#6f7276'}" stroke-width="${isMin?1.6:.9}"/>`;
  }
  s += fine;

  /* --- anell dels punts i esfera central --- */
  s += `<path d="M0,-352 A352,352 0 1 1 -0.01,-352 Z M0,-299 A299,299 0 1 0 0.01,-299 Z" fill="url(#gRehautSheen)" fill-rule="evenodd"/>`;
  s += `<circle r="298" fill="#0d0e10"/>`;
  s += `<circle r="297" fill="none" stroke="#24262a" stroke-width="1.2"/>`;
  s += `<circle r="298" fill="url(#gInShadowRing)"/>`;
  s += `<circle r="263" fill="url(#gDial)" filter="url(#fGrain)"/>`;
  s += `<circle r="263" fill="url(#gInShadowDial)"/>`;
  s += `<circle r="263" fill="none" stroke="#2e3034" stroke-width="2.4"/>`;
  s += `<circle r="265.5" fill="none" stroke="#000" stroke-width="2"/>`;

  /* --- índexs aplicats (tubs buits amb bisell) --- */
  const bevelIdx = (inner) => `<g fill="#0a0b0c" stroke="url(#gBevel)" stroke-width="3.2">${inner}</g><g fill="none" stroke="#2b2d31" stroke-width="1.4">`;
  let idxOuter='', idxInner='';
  for (let h=1;h<=11;h++){
    if (h===6) continue;
    const a=h*30;
    const long = (h===3||h===9);
    const r1 = long?112:158, r2 = 238, w = 30;
    idxOuter += radialPill(r1,r2,w,a);
    idxInner += radialPill(r1+6,r2-6,w-12,a);
  }
  s += `<g filter="url(#fDotShadow)">`;
  s += `<g fill="#0a0b0c" stroke="url(#gBevel)" stroke-width="3.2">${idxOuter}</g>`;
  s += `<g fill="none" stroke="#303236" stroke-width="1.4">${idxInner}</g>`;
  // triangle a les 12
  s += `<path d="M-40,-238 Q-44,-240 -40,-242 L40,-242 Q44,-240 40,-238 L4,-166 Q0,-160 -4,-166 Z" fill="#0a0b0c" stroke="url(#gBevel)" stroke-width="3.2" stroke-linejoin="round"/>`;
  s += `<path d="M-28,-234 L28,-234 L0,-178 Z" fill="none" stroke="#303236" stroke-width="1.4" stroke-linejoin="round"/>`;
  s += `<line x1="0" y1="-232" x2="0" y2="-186" stroke="#55585c" stroke-width="1.6"/>`;
  s += `</g>`;

  /* --- finestreta de la data a les 6 --- */
  s += `<rect x="-21" y="164" width="42" height="48" rx="3" fill="#0b0b0c" stroke="url(#gBevel)" stroke-width="3"/>`;
  s += `<rect x="-16.5" y="168.5" width="33" height="39" fill="#f4f4f1"/>`;
  s += `<text id="dateNum" x="0" y="189.5" text-anchor="middle" dominant-baseline="central" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="600" font-size="32" fill="#111">--</text>`;

  /* --- marcatge del triti sota la data --- */
  s += `<text x="0" y="236" text-anchor="middle" dominant-baseline="central" font-family="Barlow, Arial, sans-serif" font-weight="500" font-size="13" letter-spacing="1" fill="#b4b7ba">H3 / T25</text>`;

  /* --- rètols (sense logotip de marca) --- */
  s += `<text x="0" y="-98" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-weight="700" font-size="40" letter-spacing="4" fill="#e3201b" style="filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))">KOSTOV</text>`;
  s += `<text x="0" y="-68" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-weight="600" font-size="18" letter-spacing="5" fill="#c9ccce">AUTOMATIC</text>`;
  s += `<text x="0" y="92" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-weight="700" font-size="31" letter-spacing="2.5" fill="#e4e6e7">CLAUDE</text>`;
  s += `<text x="0" y="121" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-weight="500" font-size="17" letter-spacing="1.5" fill="#c3c6c8">WATER RESIST</text>`;
  s += `<text x="0" y="143" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-weight="500" font-size="17" letter-spacing="1.5" fill="#c3c6c8">300 METERS</text>`;

  /* --- punts lluminosos de les hores (amb perla metàl·lica) --- */
  const dot = (x,y) => `<g transform="translate(${x},${y})">
      <circle r="19.5" fill="#56595d"/>
      <circle r="18" fill="url(#gLume)"/>
      <circle r="7.5" fill="url(#gBead)"/>
      <ellipse cx="-6" cy="-8" rx="5" ry="3" fill="#fff" opacity=".35" transform="rotate(-35 -6 -8)"/>
    </g>`;
  let dots = '';
  DOT_POS.length = 0;
  for (let h=0;h<12;h++){
    const [x,y]=P(289,h*30);
    if (h===0) DOT_POS.push([x-21.5,y],[x+21.5,y]); else DOT_POS.push([x,y]);
  }
  for (const [x,y] of DOT_POS) dots += dot(x,y);
  s += `<g filter="url(#fDotShadow)">${dots}</g>`;

  document.getElementById('baseLayer').innerHTML = s;
}

/* =========================================================
   Bisell giratori (unidireccional, clics d'1 minut)
   ========================================================= */
function buildBezel(){
  let s = `<defs>
    <radialGradient id="gInsert" cx="50%" cy="50%" r="50%">
      <stop offset=".82" stop-color="#050506"/><stop offset=".93" stop-color="#141517"/><stop offset="1" stop-color="#070708"/>
    </radialGradient>
    <linearGradient id="gGrey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7074"/><stop offset=".35" stop-color="#a6a9ac"/><stop offset=".7" stop-color="#8b8e92"/><stop offset="1" stop-color="#5e6165"/>
    </linearGradient>
    <linearGradient id="gBezEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a6d72"/><stop offset=".28" stop-color="#26282b"/><stop offset=".6" stop-color="#0c0c0d"/><stop offset=".85" stop-color="#000"/><stop offset="1" stop-color="#1c1d20"/>
    </linearGradient>
    <linearGradient id="gInsertSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".35" stop-color="#fff" stop-opacity=".0"/>
      <stop offset=".75" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f9296"/><stop offset=".5" stop-color="#eceeef"/><stop offset="1" stop-color="#9ea1a5"/>
    </linearGradient>
    <linearGradient id="gPip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8d91"/><stop offset=".5" stop-color="#2c2e31"/><stop offset="1" stop-color="#5a5d61"/>
    </linearGradient>
  </defs>
  <g id="bezelRot">`;
  // zona tàctil: només l'anell del bisell
  const hitPath = `<path id="bezelHit" class="bezel-hit" d="M0,-440 A440,440 0 1 1 -0.01,-440 Z M0,-356 A356,356 0 1 0 0.01,-356 Z" fill="#000" fill-opacity="0" fill-rule="evenodd"/>`;
  // vora exterior
  s += `<path d="${ringSector(360,433,0,359.99)}" fill="#0c0c0d"/>`;
  s += `<circle r="429" fill="none" stroke="url(#gBezEdge)" stroke-width="8"/>`;
  s += `<circle r="432.5" fill="none" stroke="#2f3135" stroke-width="1.5"/>`;
  s += `<circle r="425" fill="none" stroke="#000" stroke-width="3"/>`;
  // inserció negra
  s += `<path d="M0,-422 A422,422 0 1 1 -0.01,-422 Z M0,-362 A362,362 0 1 0 0.01,-362 Z" fill="url(#gInsert)" fill-rule="evenodd"/>`;
  // sector gris 0–21,5 min
  s += `<path d="${ringSector(362,422,0.6,129)}" fill="url(#gGrey)"/>`;
  // marques del sector gris
  let g='';
  for (let m=1;m<=21;m++){
    if (m===10||m===20) continue;
    const a=m*6;
    if (m===5||m===15){
      g += radialPill(364,421,7,a,1.5);
    } else {
      g += radialPill(399,421,3.6,a,1);
    }
  }
  s += `<g fill="#0a0a0b">${g}</g>`;
  // barres clares del sector negre
  let bars='';
  for (const m of [25,35,45,55]) bars += radialPill(370,414,10,m*6,2);
  s += `<g fill="url(#gBar)">${bars}</g>`;
  // números
  for (const m of [10,20,30,40,50]){
    const a=m*6, [x,y]=P(391,a);
    // totes orientades des de l'eix: la part de dalt de la xifra mira enfora (com a l'original)
    const rot = a;
    const fill = m<=20 ? '#0b0b0c' : '#d6d8da';
    s += `<text class="bznum" x="${x}" y="${y}" transform="rotate(${rot} ${x} ${y})" text-anchor="middle" dominant-baseline="central" font-family="'Russo One', 'Arial Black', sans-serif" font-size="54" letter-spacing="1" fill="${fill}">${m}</text>`;
  }
  // lluentor i ombra sobre la inserció (dona volum a l'anell)
  s += `<path d="M0,-422 A422,422 0 1 1 -0.01,-422 Z M0,-362 A362,362 0 1 0 0.01,-362 Z" fill="url(#gInsertSheen)" fill-rule="evenodd" pointer-events="none"/>`;
  s += `<circle r="362.5" fill="none" stroke="#000" stroke-width="2.5" opacity=".8"/>`;
  s += `<circle r="421" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="1.2"/>`;
  // perla lluminosa a zero, dins d'un rombe
  s += `<g transform="translate(0,-404)">
      <rect x="-22" y="-22" width="44" height="44" rx="4" transform="rotate(45)" fill="url(#gPip)" stroke="#9a9da1" stroke-width="2"/>
      <circle r="11" fill="url(#gLume)"/>
      <circle r="11" fill="none" stroke="#6d7074" stroke-width="1.5"/>
    </g>`;
  s += `</g>` + hitPath;
  document.getElementById('bezelLayer').innerHTML = s;
}

      <feMerge><feMergeNode in="rb"/><feMergeNode in="SourceGraphic"/></feMerge>

/* =========================================================
   CARA DEL DARRERE — diver blau "Grand Sake"
   (mateixes coordenades que la cara davantera: centre 0,0)
   ========================================================= */
const B_CREAM = '#ece7d6';
const B_IDX = [];   // formes de lluminescència dels índexs (per a la capa nocturna)

function buildBackBezel(){
  let s = `<defs>
    <linearGradient id="bSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/><stop offset=".28" stop-color="#a7aeb6"/><stop offset=".5" stop-color="#eef1f3"/>
      <stop offset=".74" stop-color="#7a828b"/><stop offset="1" stop-color="#cfd4d9"/>
    </linearGradient>
    <radialGradient id="bInsert" cx="50%" cy="50%" r="50%">
      <stop offset=".7" stop-color="#080d18"/><stop offset=".84" stop-color="#111a2e"/><stop offset=".95" stop-color="#0c1424"/><stop offset="1" stop-color="#050910"/>
    </radialGradient>
    <linearGradient id="bInsertSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fbfff" stop-opacity=".16"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".75" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#9fbfff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="bTri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/><stop offset=".5" stop-color="#9aa1a9"/><stop offset="1" stop-color="#e3e6e9"/>
    </linearGradient>
    <radialGradient id="bLumeD" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#fffdf4"/><stop offset=".6" stop-color="${B_CREAM}"/><stop offset="1" stop-color="#bdb69c"/>
    </radialGradient>
  </defs>
  <g id="bezelRotB">`;
  // cantell d'acer amb dents planes (corona del bisell), com a la foto
  const N = 30, seg = 360/N;
  let pts = [];
  for (let i=0; i<N; i++){
    const a0 = i*seg;
    pts.push(P(425, a0)); pts.push(P(433, a0+0.6));
    for (let a=a0+1.6; a<=a0+seg*0.56; a+=1.4) pts.push(P(433, a));
    pts.push(P(433, a0+seg*0.58)); pts.push(P(425, a0+seg*0.6));
    pts.push(P(425, a0+seg*0.99));
  }
  s += `<path d="M${pts.map(p=>p.join(',')).join(' L')} Z M0,-411 A411,411 0 1 0 0.01,-411 Z" fill="url(#bSteel)" fill-rule="evenodd" stroke="#6c737b" stroke-width="1.1" stroke-linejoin="round"/>`;
  s += `<circle r="423.5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1"/>`;
  s += `<circle r="412" fill="none" stroke="#5d646c" stroke-width="2"/>`;
  // inserció ceràmica: números i barres a la part de fora, punts de minut a la vora de dins
  s += `<path d="M0,-411 A411,411 0 1 1 -0.01,-411 Z M0,-322 A322,322 0 1 0 0.01,-322 Z" fill="url(#bInsert)" fill-rule="evenodd"/>`;
  let dots = '', bars = '';
  for (let m=1; m<60; m++){
    const a = m*6;
    if (m%10===0) continue;
    if (m%5===0) bars += radialPill(337, 399, 9.5, a, 1.5);
    else { const [x,y] = P(339,a); dots += `<rect x="${x-3}" y="${y-3}" width="6" height="6" rx=".8" transform="rotate(${a} ${x} ${y})"/>`; }
  }
  for (const m of [10,20,30,40,50]){ const [x,y] = P(339, m*6); dots += `<rect x="${x-3}" y="${y-3}" width="6" height="6" rx=".8" transform="rotate(${m*6} ${x} ${y})"/>`; }
  s += `<g fill="${B_CREAM}">${dots}${bars}</g>`;
  for (const m of [10,20,30,40,50]){
    const a = m*6, [x,y] = P(376,a);
    s += `<text x="${x}" y="${y}" transform="rotate(${a} ${x} ${y})" text-anchor="middle" dominant-baseline="central"
            font-family="Saira, 'Russo One', 'Arial Black', sans-serif" font-weight="600" font-stretch="125%" font-size="52" letter-spacing="1"
            fill="${B_CREAM}" stroke="#5f5c52" stroke-width="1.1" paint-order="stroke">${m}</text>`;
  }
  // triangle d'acer amb el punt lluminós a zero (a la part de fora; a sota hi segueixen els punts)
  s += `<g transform="translate(0,-382)">
      <path d="M-31,-23 Q-34,-25 -31,-27 L31,-27 Q34,-25 31,-23 L3,25 Q0,29 -3,25 Z" fill="url(#bTri)" stroke="#7d848c" stroke-width="1.4"/>
      <circle cx="0" cy="-7" r="12" fill="url(#bLumeD)" stroke="#23272d" stroke-width="3.2"/>
    </g>`;
  s += `<path d="M0,-411 A411,411 0 1 1 -0.01,-411 Z M0,-322 A322,322 0 1 0 0.01,-322 Z" fill="url(#bInsertSheen)" fill-rule="evenodd" pointer-events="none"/>`;
  s += `<circle r="322.5" fill="none" stroke="#000" stroke-width="2.4" opacity=".8"/>`;
  s += `</g>`;
  s += `<path id="bezelHitB" class="bezel-hit" d="M0,-440 A440,440 0 1 1 -0.01,-440 Z M0,-318 A318,318 0 1 0 0.01,-318 Z" fill="#000" fill-opacity="0" fill-rule="evenodd"/>`;
  document.getElementById('bBezel').innerHTML = s;
}

function buildBackDial(){
  let s = `<defs>
    <radialGradient id="bDialG" cx="40%" cy="36%" r="72%">
      <stop offset="0" stop-color="#5b6caa"/><stop offset=".35" stop-color="#3b4c8b"/><stop offset=".7" stop-color="#27366b"/><stop offset="1" stop-color="#121b3f"/>
    </radialGradient>
    <filter id="bWave" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.006 0.022" numOctaves="3" seed="11" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="6" diffuseConstant="1.15" lighting-color="#ffffff" result="lit">
        <feDistantLight azimuth="235" elevation="34"/>
      </feDiffuseLighting>
      <feComposite in="lit" in2="SourceGraphic" operator="arithmetic" k1="1.5" k2="0" k3="0.12" k4="-0.05" result="mix"/>
      <feComposite in="mix" in2="SourceAlpha" operator="in"/>
    </filter>
    <radialGradient id="bVig" cx="50%" cy="50%" r="50%">
      <stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset=".9" stop-color="#000814" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <radialGradient id="bShine" cx="34%" cy="26%" r="45%">
      <stop offset="0" stop-color="#b8d4ff" stop-opacity=".22"/><stop offset="1" stop-color="#b8d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bRehaut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2230"/><stop offset=".5" stop-color="#07090e"/><stop offset="1" stop-color="#141925"/>
    </linearGradient>
    <linearGradient id="bFrame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a9198"/><stop offset=".22" stop-color="#ffffff"/><stop offset=".5" stop-color="#c3c9cf"/><stop offset=".78" stop-color="#f4f6f8"/><stop offset="1" stop-color="#737a82"/>
    </linearGradient>
    <linearGradient id="bLumeI" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d3bb"/><stop offset=".45" stop-color="#f8f5ea"/><stop offset="1" stop-color="#d2cbb0"/>
    </linearGradient>
    <filter id="bIdxShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="4" stdDeviation="2.4" flood-color="#000" flood-opacity=".75"/>
    </filter>
  </defs>`;
  if (DIAL_ONLY) s += `<circle r="433" fill="#050506" filter="url(#fCaseShadow)"/>`;
  // anell negre inclinat entre el bisell i l'esfera, amb el filet clar i la 2a fila de marques tocant l'esfera
  s += `<circle r="322" fill="url(#bRehaut)"/>`;
  s += `<circle r="310" fill="none" stroke="#8d949c" stroke-width="1.6" opacity=".85"/>`;
  s += `<circle r="308.6" fill="none" stroke="#000" stroke-width="1.2" opacity=".7"/>`;
  let t = '', t5 = '';
  for (let m=0; m<60; m++){
    const a = m*6;
    if (m%5===0) t5 += radialPill(270, 288, 6.5, a, .6);
    else t += radialPill(272, 284, 1.6, a, .3);
  }
  s += `<g fill="#c9ccd0" opacity=".9">${t}</g><g fill="#9aa0a7">${t5}</g>`;
  // esfera d'onades
  s += `<circle r="270" fill="url(#bDialG)" filter="url(#bWave)"/>`;
  s += `<circle r="270" fill="url(#bShine)"/>`;
  s += `<circle r="270" fill="url(#bVig)"/>`;
  s += `<circle r="270" fill="url(#gInShadowDial)"/>`;
  s += `<circle r="270.5" fill="none" stroke="#0a1222" stroke-width="1.6"/>`;
  s += `<text x="0" y="0" transform="rotate(24) translate(0,254)" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-weight="500" font-size="8.5" letter-spacing="1.4" fill="${B_CREAM}" opacity=".8">JAPAN</text>`;

  // índexs aplicats: marc d'acer polit + lluminescència
  B_IDX.length = 0;
  let idx = '';
  const bar = (a) => {
    const r1 = 188, r2 = 258, w = 33;
    idx += `<g transform="rotate(${a})">
        <rect x="${-w/2}" y="${-r2}" width="${w}" height="${r2-r1}" rx="2.5" fill="url(#bFrame)" stroke="#5b6168" stroke-width=".8"/>
        <rect x="${-w/2+5.5}" y="${-r2+5.5}" width="${w-11}" height="${r2-r1-11}" rx="1.5" fill="url(#bLumeI)"/>
      </g>`;
    B_IDX.push(`<rect transform="rotate(${a})" x="${-w/2+5.5}" y="${-r2+5.5}" width="${w-11}" height="${r2-r1-11}" rx="1.5"/>`);
  };
  for (let h=1; h<12; h++) bar(h*30);
  for (const sx of [-1,1]){
    const o = `${sx*4},-260 ${sx*46},-260 ${sx*38},-186 ${sx*4},-186`;
    const i = `${sx*9.5},-254.5 ${sx*39.5},-254.5 ${sx*33},-191.5 ${sx*9.5},-191.5`;
    idx += `<polygon points="${o}" fill="url(#bFrame)" stroke="#5b6168" stroke-width=".8" stroke-linejoin="round"/><polygon points="${i}" fill="url(#bLumeI)"/>`;
    B_IDX.push(`<polygon points="${i}"/>`);
  }
  s += `<g filter="url(#bIdxShadow)">${idx}</g>`;

  // indicador de reserva de marxa (a les 8)
  const pc = [-66, 126], rr = 80;
  const arc = (r,a1,a2) => { const [x1,y1]=P(r,a1), [x2,y2]=P(r,a2); return `M${pc[0]+x1},${pc[1]+y1} A${r},${r} 0 0 0 ${pc[0]+x2},${pc[1]+y2}`; };
  s += `<g fill="none" stroke-linecap="round">
      <path d="${arc(rr,0,-100)}" stroke="#d9dde2" stroke-width="2.6"/>
      <path d="${arc(rr,-62,-100)}" stroke="#d9dde2" stroke-width="7"/>
      <path d="M${pc[0]+P(rr-9,0)[0]},${pc[1]+P(rr-9,0)[1]} L${pc[0]+P(rr+7,0)[0]},${pc[1]+P(rr+7,0)[1]}" stroke="#d9dde2" stroke-width="2.6"/>
    </g>`;

  // rètols (la marca canviada, amb el mateix estil de lletra gòtica)
  s += `<text x="0" y="-98" text-anchor="middle" font-family="'UnifrakturMaguntia', 'Old English Text MT', serif" font-size="40" fill="#efe6c9" style="filter:drop-shadow(0 1.5px 1.2px rgba(0,0,0,.7))">Grand Sake</text>`;
  const sub = (y, txt, fs) => `<text x="0" y="${y}" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-weight="500" font-size="${fs}" letter-spacing=".6" fill="#eae5d4">${txt}</text>`;
  s += sub(102, 'AUTOMATIC', 13.5) + sub(128, 'UFA', 19) + sub(153, "DIVER'S 300m", 13.5);
  document.getElementById('bBase').innerHTML = s;
}

function buildBackGlow(){
  let s = `<defs>
    <radialGradient id="gLumeNB" cx="40%" cy="38%" r="70%">
      <stop offset="0" stop-color="#eafff9"/><stop offset=".55" stop-color="#9ff2dc"/><stop offset="1" stop-color="#4fc9ad"/>
    </radialGradient>

/* =========================================================
   GIR 3D (8 s): perspectiva, dues cares i capes de gruix.
   Cada toc a l'esfera suma 180°, sempre en el mateix sentit.
   ========================================================= */
function initFlip(){
  const watch = document.getElementById('watch');
  const flip = document.getElementById('watchFlip');
  const front = flip.querySelector('.face.front'), back = flip.querySelector('.face.back');
  const edges = [];
  // colors del cantell: negre (bisell KOSTOV) cap a acer (bisell Grand Sake)
  const mix = (t) => { const a=[16,17,19], b=[150,157,165]; return a.map((v,i)=>Math.round(v+(b[i]-v)*t)); };
  function layout(){
    const w = watch.getBoundingClientRect().width || 600;
    const th = Math.max(6, Math.round(w * 0.026));          // mig gruix
    watch.style.perspective = Math.round(w * 2.6) + 'px';
    front.style.transform = `translateZ(${th}px)`;
    back.style.transform  = `rotateY(180deg) translateZ(${th}px)`;
    edges.forEach(e => e.remove()); edges.length = 0;
    for (let z = -th + 1; z <= th - 1; z += 2){
      const t = (th - z) / (2*th);                              // 0 davant · 1 darrere
      const [r,g,b] = mix(t);
      const d = document.createElement('div');
      d.className = 'edge';
      d.style.transform = `translateZ(${z}px)`;
      d.style.background = `radial-gradient(circle, rgb(${r*.55|0},${g*.55|0},${b*.55|0}) 0%, rgb(${r},${g},${b}) 88%, rgb(${r*.7|0},${g*.7|0},${b*.7|0}) 100%)`;
      flip.insertBefore(d, flip.firstChild);
      edges.push(d);
    }
  }
  layout();
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });

  let turns = 0;
  const flipBtn = document.getElementById('flipBtn');
  const doFlip = () => {
    turns += 1;
    flipSound(8);
    flipBtn.classList.remove('spinning'); void flipBtn.offsetWidth; flipBtn.classList.add('spinning');
    flip.style.transform = `rotateY(${turns * 180}deg)`;
    watch.setAttribute('aria-label', turns % 2 ? 'Rellotge Grand Sake. Toca per girar-lo.' : 'Rellotge KOSTOV. Toca per girar-lo.');
  };
  watch.addEventListener('click', e => {
    if (e.target.closest('.bezel-hit')) return;          // tocar el bisell el fa girar, no gira el rellotge
    doFlip();
  });
  watch.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); doFlip(); } });
  flipBtn.addEventListener('click', () => { enableSound(); doFlip(); });
}

/* =========================================================
   Moviment automàtic: 6 batecs/s (21.600 a/h)
   ========================================================= */
const BEAT = 1000/6;
let lastBeat = -1, lastDay = -1;
function tick(){
  const now = new Date();
  const ms = now.getMilliseconds();
  const beat = Math.floor(ms / BEAT);
  const key = now.getSeconds()*6 + beat;
  if (key !== lastBeat){
    lastBeat = key;
    const s = now.getSeconds() + beat*BEAT/1000;
    const m = now.getMinutes() + s/60;
    const h = (now.getHours()%12) + m/60;
    hSec.setAttribute('transform', `rotate(${(s*6).toFixed(3)})`);
    hMin.setAttribute('transform', `rotate(${(m*6).toFixed(3)})`);
    hHour.setAttribute('transform', `rotate(${(h*30).toFixed(3)})`);
    hSecB.setAttribute('transform', `rotate(${(s*6).toFixed(3)})`);
    hMinB.setAttribute('transform', `rotate(${(m*6).toFixed(3)})`);
    hHourB.setAttribute('transform', `rotate(${(h*30).toFixed(3)})`);
    checkHourVoice(now);
    if (now.getDate() !== lastDay){
      lastDay = now.getDate();
      const dn = document.getElementById('dateNum'); dn.textContent = lastDay;
      if (lastDay > 9){ dn.setAttribute('textLength','27'); dn.setAttribute('lengthAdjust','spacingAndGlyphs'); } else dn.removeAttribute('textLength');
      onNewDay();
    }
  }
  requestAnimationFrame(tick);
}

/* bisell: gir antihorari per clics de 6° (arrossegar); doble clic el reinicia */
/* so de carraca: un clic metàl·lic sintetitzat (Web Audio) per cada minut del bisell */
let actx = null, clickBuf = null;
function audioUnlock(){
  try{
    if (!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const len = Math.floor(actx.sampleRate * 0.022);
      clickBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = clickBuf.getChannelData(0);
      for (let i=0; i<len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 7);
    }
    if (actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function ratchet(){
  if (!actx || !soundPref) return;
  try{
    const t = actx.currentTime;
    const src = actx.createBufferSource(); src.buffer = clickBuf;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2900 + Math.random()*500; bp.Q.value = 3.5;
    const g = actx.createGain(); g.gain.value = 1.1;
    src.connect(bp); bp.connect(g); g.connect(actx.destination); src.start(t);
    const o = actx.createOscillator(), og = actx.createGain();       // ressonància metàl·lica curta
    o.type = 'triangle'; o.frequency.value = 4600 + Math.random()*300;
    og.gain.setValueAtTime(0.09, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
    o.connect(og); og.connect(actx.destination); o.start(t); o.stop(t + 0.04);
    if (navigator.vibrate) navigator.vibrate(4);
  }catch(e){}
}

/* bisell: gir només antihorari, a clics de 6° (1 minut); doble clic el reinicia */
function setupBezel(layerId='bezelLayer', hitId='bezelHit', rotId='bezelRot', pipId='glowPip'){
  const layer = document.getElementById(layerId);
  const hit = document.getElementById(hitId);
  const rot = document.getElementById(rotId);
  let angle = 0, dragging = false, prev = 0, acc = 0;
  const setAngle = a => {
    angle = a;
    rot.setAttribute('transform', `rotate(${angle})`);
    const gp = document.getElementById(pipId); if (gp) gp.setAttribute('transform', `rotate(${angle})`);
  };
  const ptrAngle = e => {
    const r = layer.getBoundingClientRect();
    const x = e.clientX - (r.left + r.width/2), y = e.clientY - (r.top + r.height/2);
    return Math.atan2(x, -y) * 180/Math.PI;
  };
  hit.addEventListener('touchstart', e => e.preventDefault(), {passive:false});   // dins l'anell, no fa desplaçar la pàgina
  hit.addEventListener('pointerdown', e => {
    audioUnlock();
    dragging = true; prev = ptrAngle(e); acc = 0;
    hit.setPointerCapture(e.pointerId); layer.classList.add('drag');
  });
  hit.addEventListener('pointermove', e => {
    if (!dragging) return;
    const a = ptrAngle(e); let d = a - prev; prev = a;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    acc += d;
    let steps = 0;
    while (acc <= -6){ acc += 6; steps++; }
    if (acc > 0) acc = 0;          // en sentit horari no gira (com un bisell de busseig)
    if (steps){ setAngle(angle - 6*steps); for (let i=0; i<Math.min(steps,3); i++) setTimeout(ratchet, i*18); }
  });
  const end = () => { dragging = false; layer.classList.remove('drag'); };
  hit.addEventListener('pointerup', end);
  hit.addEventListener('pointercancel', end);
  hit.addEventListener('dblclick', () => { audioUnlock(); setAngle(0); ratchet(); });
}

/* =========================================================
   Festius de Barcelona
   Font: Dades obertes de Catalunya (Generalitat)
   - Calendari laboral de Catalunya ......... yf2b-mjr6
   - Calendari de festes locals a Catalunya . b4eh-r8up (Barcelona: INE 08019)
   ========================================================= */
const API = 'https://analisi.transparenciacatalunya.cat/resource/';
const REFRESH_MS = 6 * 3600 * 1000;           // es torna a consultar cada 6 h
const MONTHS = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const DOW = ['Dl','Dt','Dc','Dj','Dv','Ds','Dg'];

function easter(y){ // algorisme de Meeus/Jones/Butcher
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);

/* Noms i festes tradicionals (també quan cauen en diumenge i no es traslladen) */
function namedFeasts(y){
  const E = easter(y);
  const f = {};
  const put = (d,n,t) => f[iso(d)] = {name:n, type:t};
  put(new Date(y,0,1),  "Cap d'Any", 'general');
  put(new Date(y,0,6),  'Reis', 'general');
  put(addDays(E,-2),    'Divendres Sant', 'general');
  put(addDays(E,1),     'Dilluns de Pasqua Florida', 'general');
  put(new Date(y,4,1),  'Festa del Treball', 'general');
  put(new Date(y,5,24), 'Sant Joan', 'general');
  put(new Date(y,7,15), "L'Assumpció", 'general');
  put(new Date(y,8,11), 'Diada Nacional de Catalunya', 'general');
  put(new Date(y,9,12), "Festa Nacional d'Espanya", 'general');
  put(new Date(y,10,1), 'Tots Sants', 'general');
  put(new Date(y,11,6), 'Dia de la Constitució', 'general');
  put(new Date(y,11,8), 'La Immaculada', 'general');
  put(new Date(y,11,25),'Nadal', 'general');
  put(new Date(y,11,26),'Sant Esteve', 'general');
  put(addDays(E,50),    'Segona Pasqua (Pasqua Granada)', 'local');
  put(new Date(y,8,24), 'La Mercè', 'local');
  return f;
}

const holidays = {};      // any -> { 'aaaa-mm-dd': {name,type} }
const holState = {};      // any -> 'oficial' | 'memòria cau' | 'càlcul'

function cacheGet(y){ try{ return JSON.parse(localStorage.getItem('bcnHol-'+y)); }catch(e){ return null; } }
function cacheSet(y,v){ try{ localStorage.setItem('bcnHol-'+y, JSON.stringify(v)); }catch(e){} }

async function fetchJSON(url){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 12000);
  try{ const r = await fetch(url,{signal:ctl.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}

async function loadHolidays(y, force){
  const cached = cacheGet(y);
  if (!force && cached && Date.now() - cached.t < REFRESH_MS){
    holidays[y] = cached.d; holState[y] = cached.s; return;
  }
  const names = namedFeasts(y);
  try{
    const [gen, loc] = await Promise.all([
      fetchJSON(`${API}yf2b-mjr6.json?any_calendari=${y}&$limit=500`),
      fetchJSON(`${API}b4eh-r8up.json?codi_municipi_ine=08019&any_calendari=${y}&$limit=50`)
    ]);
    if (!gen.length && !loc.length) throw new Error('sense dades per a '+y);
    const out = {};
    for (const r of gen){
      const k = (r.data||'').slice(0,10); if(!k) continue;
      out[k] = { name: names[k]?.name || 'Festiu', type:'general' };
    }
    for (const r of loc){
      const k = (r.data||'').slice(0,10); if(!k) continue;
      out[k] = { name: (names[k]?.type==='local' && names[k].name) || 'Festa local de Barcelona', type:'local' };
    }
    // festes tradicionals que cauen en diumenge (no figuren al calendari laboral)
    for (const [k,v] of Object.entries(names)){
      const d = new Date(k+'T12:00:00');
      if (!out[k] && d.getDay()===0 && v.type==='general') out[k] = {...v, sunday:true};
    }
    holidays[y] = out; holState[y] = 'oficial';
    cacheSet(y, {t:Date.now(), d:out, s:'oficial'});
  }catch(err){
    if (cached){ holidays[y] = cached.d; holState[y] = 'memòria cau'; }
    else { holidays[y] = names; holState[y] = 'càlcul'; }
  }
}

/* =========================================================
   Calendari navegable (sense límit) — sempre 6 setmanes
   ========================================================= */
const calGrid = document.getElementById('calGrid');
const calMonthEl = document.getElementById('calMonth'), calYearEl = document.getElementById('calYear');
const calTodayBtn = document.getElementById('calToday');
let viewY, viewM, curKey = null;
const holLoading = {};

function ensureHolidays(y){
  if (holidays[y] || holLoading[y]) return;
  holLoading[y] = loadHolidays(y, false).finally(() => {
    delete holLoading[y];
    if (y === viewY) renderCalendar();
  });
}

function renderCalendar(dir){
  const now = new Date(), ty = now.getFullYear(), tm = now.getMonth(), td = now.getDate();
  if (viewY === undefined){ viewY = ty; viewM = tm; }
  const y = viewY, mo = viewM;
  calMonthEl.textContent = MONTHS[mo];
  calYearEl.textContent = y;
  calTodayBtn.hidden = (y === ty && mo === tm);
  ensureHolidays(y);
  const H = holidays[y] || namedFeasts(y);
  let html = DOW.map((d,i)=>`<div class="dow${i>4?' we':''}">${d}</div>`).join('');
  const lead = (new Date(y,mo,1).getDay()+6)%7;
  for (let i=0; i<42; i++){                       // 6 setmanes fixes
    const dt = new Date(y, mo, 1 - lead + i), d = dt.getDate(), wd = dt.getDay();
    if (dt.getMonth() !== mo){ html += `<div class="day out" aria-hidden="true">${d}</div>`; continue; }
    const k = iso(dt), h = H[k], cls = ['day'];
    if (wd===6) cls.push('sat');
    if (wd===0) cls.push('sun');
    if (h) cls.push('hol');
    if (y===ty && mo===tm && d===td) cls.push('today');
    const attrs = h ? ` data-k="${k}" role="button" tabindex="0" aria-expanded="false"` : '';
    html += `<div class="${cls.join(' ')}"${attrs} aria-label="${d} ${MONTHS[mo]} ${y}${h?' – '+h.name:''}">${d}</div>`;
  }
  calGrid.innerHTML = html;
  closePop();
  if (dir && calGrid.animate){
    calGrid.animate([{transform:`translateX(${dir*26}px)`, opacity:0},{transform:'none', opacity:1}],
                    {duration:230, easing:'cubic-bezier(.2,.7,.2,1)'});
  }
}
function shiftMonth(n){
  let m = viewM + n, y = viewY;
  y += Math.floor(m/12); m = ((m%12)+12)%12;
  viewY = y; viewM = m;
  renderCalendar(n > 0 ? 1 : -1);
}
function goToday(){
  const n = new Date(), target = n.getFullYear()*12 + n.getMonth(), cur = viewY*12 + viewM;
  viewY = n.getFullYear(); viewM = n.getMonth();
  renderCalendar(target === cur ? 0 : (target > cur ? 1 : -1));
}
function onNewDay(){        // a mitjanit: si es mirava el mes actual, segueix el mes actual
  const n = new Date(), key = n.getFullYear()*12 + n.getMonth();
  if (curKey !== null && viewY*12 + viewM === curKey){ viewY = n.getFullYear(); viewM = n.getMonth(); }
  curKey = key;
  renderCalendar();
}

document.getElementById('calPrev').addEventListener('click', () => shiftMonth(-1));
document.getElementById('calNext').addEventListener('click', () => shiftMonth(1));
calTodayBtn.addEventListener('click', goToday);
// doble toc (o doble clic) sobre el nom del mes: torna al mes actual
let lastTitleTap = 0;
document.getElementById('calTitle').addEventListener('click', () => {
  const t = performance.now();
  if (t - lastTitleTap < 400){ goToday(); lastTitleTap = 0; } else lastTitleTap = t;
});
// lliscar amb el dit (o arrossegar amb el ratolí) per canviar de mes
let swipe = null, suppressClick = false;
calGrid.addEventListener('pointerdown', e => { swipe = {x:e.clientX, y:e.clientY}; });
calGrid.addEventListener('pointerup', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;

const DOW_LONG = ['diumenge','dilluns','dimarts','dimecres','dijous','divendres','dissabte'];
const MONTH_DE = m => (/^[aeiou]/.test(MONTHS[m]) ? "d'" : 'de ') + MONTHS[m];
let popCell = null;
function closePop(){
  const pop = document.getElementById('pop');
  if (pop) pop.classList.remove('show');
  if (popCell){ popCell.classList.remove('open'); popCell.setAttribute('aria-expanded','false'); }
  popCell = null;
}
function openPop(cell){
  const k = cell.dataset.k, y = +k.slice(0,4);
  const H = holidays[y] || namedFeasts(y), h = H[k]; if (!h) return;
  const d = new Date(k+'T12:00:00');
  const pop = document.getElementById('pop'), cal = pop.parentElement;
  pop.querySelector('.pop-name').textContent = h.name;
  pop.querySelector('.pop-date').textContent = (w => w[0].toUpperCase()+w.slice(1))(`${DOW_LONG[d.getDay()]}, ${d.getDate()} ${MONTH_DE(d.getMonth())} de ${y}`);

  if (popCell) { popCell.classList.remove('open'); popCell.setAttribute('aria-expanded','false'); }
  popCell = cell; cell.classList.add('open'); cell.setAttribute('aria-expanded','true');
  pop.style.left = '0px'; pop.style.top = '0px';
  const cr = cal.getBoundingClientRect(), r = cell.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 9;
  const cx = r.left - cr.left + r.width/2;
  let left = Math.max(8, Math.min(cx - pw/2, cr.width - pw - 8));
  let top = r.top - cr.top - ph - gap, up = true;
  if (top < 4){ top = r.bottom - cr.top + gap; up = false; }
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  pop.style.setProperty('--ax', Math.max(14, Math.min(pw-14, cx - left)) + 'px');
  pop.classList.toggle('up', up); pop.classList.toggle('down', !up);
  pop.classList.add('show');
}
calGrid.addEventListener('click', e => {

/* =========================================================
   LA RODA: calendari → ara → lloc i sol → previsió → avisos → calendari…
   (lliscar amunt/avall, roda del ratolí o fletxes; doble toc torna al calendari)
   ========================================================= */
const wheelEl = document.getElementById('wheel'), drumEl = document.getElementById('drum');
const FACES = [...drumEl.children], NF = FACES.length, STEP = 360 / NF;
let wIdx = 0, wR = 0;
const wActive = () => ((wIdx % NF) + NF) % NF;
const wdots = document.getElementById('wdots');
wdots.innerHTML = FACES.map(()=>'<i></i>').join('');
function placeDrum(animate){
  if (!animate){ drumEl.style.transition = 'none'; requestAnimationFrame(()=>requestAnimationFrame(()=>drumEl.style.transition = '')); }
  drumEl.style.transform = `translateZ(${-wR}px) rotateX(${wIdx*STEP}deg)`;
  const a = wActive();
  FACES.forEach((f,i) => f.classList.toggle('on', i === a));
  [...wdots.children].forEach((d,i) => d.classList.toggle('on', i === a));
}
function layoutWheel(){
  const h = wheelEl.clientHeight || 300;
  wR = (h/2) / Math.tan(Math.PI / NF);
  wheelEl.style.perspective = Math.round(h * 3.4) + 'px';
  FACES.forEach((f,i) => f.style.transform = `rotateX(${-i*STEP}deg) translateZ(${wR}px)`);
  placeDrum(false);
}
function spinWheel(n){
  if (!n) return;
  wIdx += n; closePop(); placeDrum(true);
  if (soundOn) for (let i=0; i<Math.min(Math.abs(n),3); i++) setTimeout(ratchet, i*70);
}
function wheelToCalendar(){
  const a = wActive(); if (!a) return;
  spinWheel(a <= NF/2 ? -a : NF - a);           // pel camí més curt
}
// dits i ratolí: lliscament vertical = girar la roda
let wSw = null, wTap = 0;
wheelEl.addEventListener('pointerdown', e => { wSw = {x:e.clientX, y:e.clientY}; });
wheelEl.addEventListener('pointerup', e => {
  if (!wSw) return;
  const dx = e.clientX - wSw.x, dy = e.clientY - wSw.y; wSw = null;
  if (Math.abs(dy) > 36 && Math.abs(dy) > 1.3*Math.abs(dx)){
    suppressClick = true; setTimeout(() => suppressClick = false, 60);
    spinWheel(dy < 0 ? 1 : -1);
    return;
  }
  // doble toc damunt del quadre (fora del calendari) torna al calendari
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && wActive() !== 0){
    const t = performance.now();
    if (t - wTap < 420){ wTap = 0; wheelToCalendar(); } else wTap = t;
  }
});
wheelEl.addEventListener('pointercancel', () => wSw = null);
let wAcc = 0, wLock = 0;
wheelEl.addEventListener('wheel', e => {
  e.preventDefault();
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  wAcc += e.deltaY;
  const now = performance.now();
  if (Math.abs(wAcc) > 40 && now > wLock){ spinWheel(wAcc > 0 ? 1 : -1); wAcc = 0; wLock = now + 480; }
}, {passive:false});
wheelEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown'){ e.preventDefault(); spinWheel(1); }
  else if (e.key === 'ArrowUp' || e.key === 'PageUp'){ e.preventDefault(); spinWheel(-1); }
  else if (e.key === 'Escape') wheelToCalendar();
});
let wRt; window.addEventListener('resize', () => { clearTimeout(wRt); wRt = setTimeout(layoutWheel, 100); });

const DIRS = ['N','NE','E','SE','S','SO','O','NO'];
