/* avisos per fenòmens extrems, calculats amb la previsió de les properes 24 h
   (llindars orientatius inspirats en els avisos de Protecció Civil / Meteocat) */
function computeAlerts(){
  const A = []; if (!lastWx) return A;
  const H = lastWx.hourly || {}, T = H.time || [], n = Math.min(T.length, 24);
  const ext = (arr, cmp) => { let v = null, at = null; for (let i=0;i<n;i++){ const x = arr && arr[i]; if (x==null) continue; if (v==null || cmp(x,v)){ v = x; at = T[i]; } } return [v, at]; };
  const lvl = (v, th) => v==null ? 0 : v >= th[2] ? 3 : v >= th[1] ? 2 : v >= th[0] ? 1 : 0;
  const sum = arr => { let t = 0; for (let i=0;i<n;i++) t += (arr && arr[i]) || 0; return t; };
  // pluja intensa (mm en una hora) o acumulada (24 h)
  const [pm, pat] = ext(H.precipitation, (a,b)=>a>b), ps = sum(H.precipitation);
  const lr = Math.max(lvl(pm, [15, 25, 40]), lvl(ps, [50, 90, 150]));
  if (lr) A.push({k:'rain', l:lr, t:'Pluja intensa', d:`Fins a ${Math.round(pm)} mm en una hora (${fmtH(pat)}) · ${Math.round(ps)} mm en 24 h`});
  // vent: ratxes
  const [gm, gat] = ext(H.wind_gusts_10m, (a,b)=>a>b), lw = lvl(gm, [70, 90, 110]);
  if (lw) A.push({k:'wind', l:lw, t:'Vent fort', d:`Ratxes de ${Math.round(gm)} km/h (${fmtH(gat)})`});
  // tempesta (i calamarsa)
  let storm = 0, sat = null;
  for (let i=0;i<n;i++){ const c = (H.weather_code||[])[i]; if (c>=95){ const l = c===95 ? 1 : 2; if (l > storm){ storm = l; sat = T[i]; } } }
  if (storm) A.push({k:'storm', l:storm, t: storm>1 ? 'Tempesta amb calamarsa' : 'Tempesta', d:`Prevista a les ${fmtH(sat)}`});
  // neu
  const sn = sum(H.snowfall), ls = lvl(sn, [0.5, 5, 20]);
  if (ls) A.push({k:'snow', l:ls, t:'Nevada', d:`${sn.toFixed(sn < 5 ? 1 : 0)} cm de neu en 24 h`});
  // boira densa
  const [vm, vat] = ext(H.visibility, (a,b)=>a<b);
  const lf = vm==null ? 0 : vm <= 100 ? 3 : vm <= 200 ? 2 : vm <= 500 ? 1 : 0;
  if (lf) A.push({k:'fog', l:lf, t:'Boira densa', d:`Visibilitat de ${Math.round(vm)} m (${fmtH(vat)})`});
  // gelada i calor
  const [tmin, tnat] = ext(H.temperature_2m, (a,b)=>a<b), [tmax, txat] = ext(H.temperature_2m, (a,b)=>a>b);
  const lg = tmin==null ? 0 : tmin <= -8 ? 3 : tmin <= -4 ? 2 : tmin <= 0 ? 1 : 0;
  if (lg) A.push({k:'frost', l:lg, t:'Gelada', d:`Mínima de ${Math.round(tmin)}° (${fmtH(tnat)})`});
  const lc = lvl(tmax, [34, 37, 40]);
  if (lc) A.push({k:'heat', l:lc, t:'Calor intensa', d:`Màxima de ${Math.round(tmax)}° (${fmtH(txat)})`});
  return A.sort((a,b)=>b.l-a.l);
}
const LVL = ['', 'Groc', 'Taronja', 'Vermell'];
const ALICO = {rain:'rain', wind:'wind', storm:'storm', snow:'snow', fog:'fog', frost:'frost', heat:'heat'};

function renderFaces(){
  const light = document.documentElement.dataset.theme === 'day';
  const place = (geo && geo.name) || '—';
  if (!lastWx){
    const msg = `<div class="calm">${ICO.clear}<div>Dades del temps no disponibles.<br>Es tornarà a provar d'aquí a poc.</div></div>`;
    fNow.innerHTML = head('Ara', place) + msg;
    fPlace.innerHTML = head('Lloc i sol', '') + `<div class="fbody"><div class="hero"><div><div class="hero-big">${place}</div><div class="hero-d">Ubicació</div></div></div></div>`;
    fFore.innerHTML = head('Previsió · 12 h') + msg;
    fAlert.innerHTML = head('Avisos · 24 h') + msg; fAlert.classList.remove('active');
    [...wdots.children][4].className = (wActive()===4?'on':'');
    return;
  }
  const c = lastWx.current, H = lastWx.hourly || {}, D = lastWx.daily || {};
  // ARA
  const tmax = D.temperature_2m_max ? Math.round(D.temperature_2m_max[0]) : null, tmin = D.temperature_2m_min ? Math.round(D.temperature_2m_min[0]) : null;
  fNow.innerHTML = head('Ara', place) + `<div class="fbody">
      <div class="hero"><div class="hero-ico">${wxIcon(c.weather_code, c.is_day===1, light)}</div>
        <div><div class="hero-t">${Math.round(c.temperature_2m)}°</div><div class="hero-d">${WX_TXT(c.weather_code)}</div></div></div>
      <div class="kv4">
        ${kv('feels', `${Math.round(c.apparent_temperature)}°`, 'Sensació tèrmica')}
        ${kv('hum', `${Math.round(c.relative_humidity_2m)}%`, 'Humitat')}
        ${kv('wind', c.wind_speed_10m!=null ? `${Math.round(c.wind_speed_10m)} <small style="font-size:.5em">km/h ${dirTxt(c.wind_direction_10m)}</small>` : '—', 'Vent')}
        ${kv('minmax', tmax!=null ? `${tmax}° / ${tmin}°` : '—', 'Màx. / mín. avui')}
      </div></div>`;
  // LLOC I SOL
  const alt = (geo.alt!=null && isFinite(geo.alt)) ? geo.alt : lastWx.elevation;
  const sr = sunTimes && sunTimes.rise[0], ss = sunTimes && sunTimes.set[0];
  const dl = (sr && ss) ? Math.round((ss - sr)/60000) : null;
  fPlace.innerHTML = head('Lloc i sol', geo.fallback ? 'per defecte' : '') + `<div class="fbody">
      <div class="hero"><div class="hero-ico">${ICO.place}</div>
        <div><div class="hero-big">${place}</div><div class="hero-d">${(+geo.lat).toFixed(3)}° N · ${(+geo.lon).toFixed(3)}° E</div></div></div>
      <div class="kv4">
        ${kv('alt', alt!=null ? `${Math.round(alt)} m` : '—', 'Altitud')}
        ${kv('day', dl!=null ? `${Math.floor(dl/60)} h ${String(dl%60).padStart(2,'0')}` : '—', 'Hores de llum')}
        ${kv('rise', hhmm(sr), 'Sortida del sol')}
        ${kv('set', hhmm(ss), 'Posta del sol')}
      </div></div>`;
  // PREVISIÓ 12 h: només el que està previst
  const T = (H.time||[]).slice(0,12), PP = H.precipitation_probability || [], WC = H.weather_code || [], VIS = H.visibility || [], SN = H.snowfall || [];
  let pmax = -1, pAt = null, fogAt = null, snowAt = null;
  for (let i=0; i<T.length; i++){
    const p = PP[i]; if (p != null && p > pmax){ pmax = p; pAt = T[i]; }
    if (!fogAt && (isFogCode(WC[i]) || (VIS[i] != null && VIS[i] < 1000))) fogAt = T[i];
    if (!snowAt && (isSnowCode(WC[i]) || (SN[i] || 0) > 0)) snowAt = T[i];
  }
  const nowH = T[0];
  const row = (ico, big, lbl, sub) => `<div class="frow">${ICO[ico]}<div class="fr-t"><b>${big}</b><span class="fr-l">${lbl}</span><span class="fr-s">${sub}</span></div></div>`;
  let rows = '';
  if (pmax >= RAIN_MIN) rows += row('rain', `${pmax}%`, 'Pluja', pAt===nowH ? 'ara mateix' : `màxim a les ${fmtH(pAt)}`);
  if (fogAt) rows += row('fog', fogAt===nowH ? 'Ara' : fmtH(fogAt), 'Boira', 'prevista en les properes 12 h');
  if (snowAt) rows += row('snow', snowAt===nowH ? 'Ara' : fmtH(snowAt), 'Neu', 'prevista en les properes 12 h');
  fFore.innerHTML = head('Previsió · 12 h', place) + (rows ? `<div class="fbody">${rows}</div>`
    : `<div class="calm">${ICO.clear}<div>Ni pluja, ni boira, ni neu previstes en les properes 12 hores.</div></div>`);
  // AVISOS 24 h
  const A = computeAlerts(), top = A.length ? A[0].l : 0;
  fAlert.classList.toggle('active', !!A.length);
  fAlert.innerHTML = head('Avisos · 24 h', A.length ? `${A.length} ${A.length>1?'avisos':'avís'}` : place) + (A.length
    ? `<div class="alist">${A.slice(0,4).map(a => `<div class="al l${a.l}">${ICO[ALICO[a.k]]}<div><b>${a.t}</b><small>${a.d}</small></div><em>${LVL[a.l]}</em></div>`).join('')}</div>
       <div class="al-src">Calculats amb la previsió d'Open-Meteo. Consulta sempre els avisos oficials de Protecció Civil i el Meteocat.</div>`
    : `<div class="calm">${ICO.ok}<div>Cap fenomen extrem previst en les properes 24 hores.</div></div>`);
  const d4 = wdots.children[4]; d4.className = (wActive()===4 ? 'on ' : '') + (top ? 'al'+top : '');
}

function renderWeather(){ renderFaces(); }

async function updateWeather(){
  try{
    if (!geo) geo = await locate();
    const {lat,lon} = geo;
    const [wx, place] = await Promise.all([
      fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
        + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m`
        + `&hourly=precipitation_probability,precipitation,weather_code,visibility,snowfall,wind_gusts_10m,temperature_2m&forecast_hours=24`
        + `&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min&forecast_days=2&timezone=auto`),
      geo.name ? Promise.resolve(null)
               : fetchJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ca`).catch(()=>null)
    ]);
    if (!geo.name){ const n = place && (place.city || place.locality || place.principalSubdivision); if (n) geo.name = n; }
    lastWx = wx;
    if (wx.daily && wx.daily.sunrise) sunTimes = {rise: wx.daily.sunrise.map(parseLocal), set: wx.daily.sunset.map(parseLocal)};
    applyTheme();
    renderFaces();
  }catch(e){
    if (!lastWx) renderFaces();
  }
}

const SOUND_KEY = 'kostovSound';
let soundPref = true;

let soundOn = false;
const soundBtn = document.getElementById('soundBtn');
function paintSound(){
  soundBtn.setAttribute('aria-pressed', String(soundPref));
  soundBtn.querySelector('.snd-on').style.display = soundPref ? '' : 'none';
  soundBtn.querySelector('.snd-off').style.display = soundPref ? 'none' : '';
}
function enableSound(){
  if (!soundPref) return;
  try{ if (navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
  audioUnlock();
  soundOn = !!actx;
}
// el navegador només deixa sonar després d'un gest: el primer toc a qualsevol lloc ho activa
['pointerdown','keydown'].forEach(ev => window.addEventListener(ev, () => { if (soundPref && !soundOn) enableSound(); }, {capture:true, passive:true}));
soundBtn.addEventListener('click', () => {
  soundPref = !soundPref;
  try{ localStorage.setItem(SOUND_KEY, soundPref ? 'on' : 'off'); }catch(e){}
  if (soundPref){ enableSound(); sayRu('Звук включён.'); }
  else { soundOn = false; try{ speechSynthesis.cancel(); }catch(e){} }
  paintSound();
});
paintSound();

/* ---- grinyol del gir: el mateix que el mur del quinqué (fricció de frontissa + cops de fusta) ---- */
let dryBus = null;
function ensureDry(){
  if (dryBus || !actx) return;
  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 3;
  dryBus = actx.createGain(); dryBus.gain.value = 0.9; dryBus.connect(comp); comp.connect(actx.destination);
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let tickBufs = null, tickOut = null;
function renderTick(tock, seed){
  const sr=actx.sampleRate,len=Math.floor(sr*.32),buf=actx.createBuffer(1,len,sr),d=buf.getChannelData(0),rnd=mulberry32(seed);
  const jit=()=>1+(rnd()-.5)*.03;
  const metal=tock?[[1180,.34,.022],[1790,.24,.014],[2640,.14,.009],[3900,.06,.006],[760,.2,.03]]
                  :[[1380,.32,.02],[2060,.22,.013],[3010,.13,.008],[4300,.05,.005],[880,.17,.026]];
  const wood=[[112,.46,.050],[198,.54,.040],[296,.42,.030],[430,.28,.022],[615,.15,.015],[870,.07,.010]];
  const woodGain=tock?1.3:1.05;
  function hit(t0,amp,metalK,woodK){
    const i0=Math.floor(t0*sr);
    for(const[f0,a,tau]of metal){const f=f0*jit(),ph=rnd()*6.283,w=6.2832*f/sr,k=Math.exp(-1/(tau*.4*sr*jit()));let e=a*amp*metalK*.6;
      for(let i=i0;i<len&&e>1e-5;i++){d[i]+=e*Math.sin(w*(i-i0)+ph);e*=k;}}
    for(const[f0,a,tau]of wood){const f=f0*jit(),w=6.2832*f/sr,k=Math.exp(-1/(tau*sr));let e=a*amp*woodK*woodGain;
      for(let i=i0;i<len&&e>1e-5;i++){const n=i-i0,att=n<sr*.0015?n/(sr*.0015):1;d[i]+=e*att*Math.sin(w*n);e*=k;}}
    let e=.14*amp,prev=0;const k=Math.exp(-1/(.0012*sr));
    for(let i=i0;i<len&&e>1e-5;i++){const x=rnd()*2-1;d[i]+=e*(x-prev);prev=x;e*=k;}
  }
  hit(0,1,1,1); hit(tock?.011:.009,.22,.6,.25);
  let pk=0;for(let i=0;i<len;i++)pk=Math.max(pk,Math.abs(d[i]));
  const g=(tock?.92:.78)/pk;for(let i=0;i<len;i++)d[i]*=g;
  return buf;
}
function woodTick(t, tock, vol=1, rate=1){
  ensureDry();
  if (!tickBufs) tickBufs = { tic:[1,2,3].map(n=>renderTick(false,100+n)), toc:[1,2,3].map(n=>renderTick(true,200+n)) };
  if (!tickOut){ tickOut=actx.createGain(); tickOut.gain.value=.4; const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200; lp.Q.value=.5;
    tickOut.connect(lp); lp.connect(dryBus); }
  const arr = tock ? tickBufs.toc : tickBufs.tic, src = actx.createBufferSource();
  src.buffer = arr[Math.floor(Math.random()*arr.length)]; src.playbackRate.value = rate*(1+(Math.random()-.5)*.006);
  const g = actx.createGain(); g.gain.value = vol*(.94+Math.random()*.08); src.connect(g); g.connect(tickOut); src.start(t);
}
function creak(t,dur,vol,pitch){
  ensureDry();
  const r=Math.random,n=48,rate=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i/(n-1);rate[i]=(16+34*Math.pow(Math.sin(Math.PI*x),.7)+(r()-.5)*9)*pitch;}
  const o=actx.createOscillator();o.type='sawtooth';o.frequency.setValueCurveAtTime(rate,t,dur);
  const sum=actx.createGain();
  [[690,10,1],[1380,14,.55],[2070,16,.3],[410,7,.45]].forEach(([f,q,a])=>{
    const bp=actx.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;
    bp.frequency.setValueAtTime(f*pitch,t);bp.frequency.linearRampToValueAtTime(f*pitch*1.08,t+dur);
    const g=actx.createGain();g.gain.value=a;o.connect(bp);bp.connect(g);g.connect(sum);});
  const env=actx.createGain();env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(vol,t+.09);
  env.gain.setValueAtTime(vol,t+dur*.55);env.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
  sum.connect(env);env.connect(lp);lp.connect(dryBus);o.start(t);o.stop(t+dur+.05);
}
// so del gir: desbloqueig, grinyol llarg i cop en encaixar (adaptat als 8 s del gir)
function flipSound(dur){
  if (!soundOn || !actx) return;
  if (actx.state === 'suspended') actx.resume();
  const t = actx.currentTime;
  woodTick(t, false, .22, .75);
  creak(t+.12, dur*0.72, .045, 1);
  woodTick(t+dur-0.06, true, .42, .5); woodTick(t+dur, false, .16, 1.1);
}

/* ---- hores en punt dites en rus ---- */
const RU_NUM = ['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать',
  'тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать','двадцать','двадцать один','двадцать два','двадцать три'];
function ruHour(h){
  if (h === 0) return 'Полночь.';
  if (h === 12) return 'Полдень.';
  if (h === 1) return 'Сейчас ровно час.';
  const d = h % 10, word = (h >= 11 && h <= 14) ? 'часов' : d === 1 ? 'час' : (d >= 2 && d <= 4) ? 'часа' : 'часов';
  return `Сейчас ровно ${RU_NUM[h]} ${word}.`;
}
let ruVoice = null;
function pickRuVoice(){ try{ const v = speechSynthesis.getVoices(); ruVoice = v.find(x => /^ru(-|_|$)/i.test(x.lang) && /Milena|Yuri|Google/i.test(x.name)) || v.find(x => /^ru/i.test(x.lang)) || null; }catch(e){} }
if ('speechSynthesis' in window){ pickRuVoice(); speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', pickRuVoice); }
function sayRu(text){
  if (!soundPref || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU'; if (ruVoice) u.voice = ruVoice; u.rate = .92; u.pitch = 1; u.volume = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}
let lastSpokenHour = -1;
function checkHourVoice(now){
  if (now.getMinutes() !== 0 || now.getSeconds() > 2) return;
  const h = now.getHours(); if (h === lastSpokenHour) return;
  lastSpokenHour = h;
  if (soundOn) sayRu(ruHour(h));
}

/* =========================================================
   Mode diürn / nocturn: automàtic (sol) o manual
   ========================================================= */
const THEME_KEY = 'kostovTheme';
let themeMode = 'auto';
try{ themeMode = localStorage.getItem(THEME_KEY) || 'auto'; }catch(e){}
function isDayNow(){
  const n = new Date();
  if (sunTimes){
    for (let i=0; i<sunTimes.rise.length; i++){
      const r = sunTimes.rise[i], s = sunTimes.set[i];
      if (r.toDateString() === n.toDateString()) return n >= r && n < s;
    }
  }
  if (lastWx) return lastWx.current.is_day === 1;
  const h = n.getHours() + n.getMinutes()/60; return h >= 7.5 && h < 19.5;
}
function setNightLume(on){
  document.querySelectorAll('.lyr-hands .hl').forEach(el => {
    if (!el.dataset.f) el.dataset.f = el.getAttribute('fill');
    if (on){ el.setAttribute('fill',`url(#${el.dataset.n||'gHandLumeN'})`); el.setAttribute('filter',`url(#${el.dataset.g||'fLumeGlowH'})`); }
    else   { el.setAttribute('fill', el.dataset.f); el.removeAttribute('filter'); }
  });
}
function applyTheme(){
  const t = themeMode === 'auto' ? (isDayNow() ? 'day' : 'night') : themeMode;
  const root = document.documentElement, changed = root.dataset.theme !== t || !root.dataset.lumeSet;
  root.dataset.theme = t;
  if (changed){
    root.dataset.lumeSet = '1';
    setNightLume(t === 'night');
    renderWeather();
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'day' ? '#e4e5e0' : '#030304';
  }
  document.querySelectorAll('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === themeMode)));
}
document.getElementById('themeSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]'); if (!b) return;
  themeMode = b.dataset.mode;
  try{ localStorage.setItem(THEME_KEY, themeMode); }catch(e){}
  applyTheme();
});

/* =========================================================
   App instal·lable: service worker (funciona sense connexió) i botó d'instal·lar
   ========================================================= */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker:', err)));
}
(function initInstall(){
  const btn = document.getElementById('installBtn'), hint = document.getElementById('iosHint');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferred = null;
  if (!standalone) btn.hidden = false;                       // el botó INS sempre a la barra, fins que l'app s'instal·la
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
  const share = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5v8.5M5.3 4.2 8 1.5l2.7 2.7M4.5 7H3.5v7h9V7h-1"/></svg>`;
  btn.addEventListener('click', async () => {
    if (deferred){ deferred.prompt(); await deferred.userChoice.catch(()=>{}); deferred = null; return; }
    hint.innerHTML = isIOS
      ? `Per instal·lar-la a l'iPhone: a Safari toca ${share} <b>Comparteix</b> i després <b>Afegeix a la pantalla d'inici</b>.`
      : location.protocol.startsWith('http')
        ? `Per instal·lar-la: obre el menú del navegador i tria <b>Instal·la l'aplicació</b> (Chrome, Edge) o <b>Afegeix a la pantalla d'inici</b>.`
        : `L'app es pot instal·lar quan s'obre des de la seva adreça web (GitHub Pages), no des d'un fitxer.`;
    hint.hidden = !hint.hidden;
  });
  hint.addEventListener('click', () => hint.hidden = true);
  window.addEventListener('appinstalled', () => { btn.hidden = true; hint.hidden = true; });
})();
