<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brúixola 3D - Gir 360º</title>
    <style>
        /* Configuració bàsica de la pàgina */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Contenidor principal per centrar i donar perspectiva 3D */
        .scene {
            width: 400px;
            height: 400px;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* El contenidor que gira */
        .compass-wrapper {
            width: 300px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            animation: girar 7s linear infinite;
        }

        /* El cos de la brúixola (la part que gira) */
        .compass {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            border-radius: 50%;
            /* Sombra per donar sensació de volum */
            box-shadow: 0 0 30px rgba(0,0,0,0.3); 
        }

        /* --- CARA FRONTAL (La imatge realista) --- */
        .front {
            width: 100%;
            height: 100%;
            position: absolute;
            border-radius: 50%;
            backface-visibility: hidden;
            /* Aquí posem la imatge de la brúixola realista */
            background-image: url('https://i.imgur.com/8YwJ5wT.png'); /* Poso una imatge similar de domini públic */
            background-size: cover;
            background-position: center;
            border: 4px solid #d4af37; /* Marc daurat */
            box-sizing: border-box;
            z-index: 2;
            /* Efecte de vidre */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- CARA POSTERIOR (El revers sòlid daurat) --- */
        .back {
            width: 100%;
            height: 100%;
            position: absolute;
            border-radius: 50%;
            backface-visibility: hidden;
            /* Simulem el metall daurat sòlid */
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b, #8b6508);
            transform: rotateY(180deg);
            border: 4px solid #d4af37;
            box-sizing: border-box;
            z-index: 1;
            /* Detall del revers perquè no sigui pla */
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        /* --- COS LATERAL (El cilindre daurat) --- */
        /* Creem un anell que simula el gruix de la brúixola */
        .side {
            width: 100%;
            height: 100%;
            position: absolute;
            border-radius: 50%;
            border: 8px solid #b8860b; /* Color daurat més fosc */
            box-sizing: border-box;
            transform: translateZ(-4px); /* El posem una mica enrere */
            background: transparent;
            box-shadow: 0 0 0 2px #8b6508; /* Vora interior */
            z-index: 0;
        }

        /* Animació de gir de 360 graus */
        @keyframes girar {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }

        /* Perquè la brúixola no estigui perfectament plana, li donem una mica d'inclinació */
        .scene {
            transform: rotateX(15deg) rotateZ(-10deg);
        }

    </style>
</head>
<body>

    <div class="scene">
        <div class="compass-wrapper">
            <div class="compass">
                <!-- El cos lateral (el cilindre) -->
                <div class="side"></div>
                <!-- La cara frontal (la brúixola) -->
                <div class="front"></div>
                <!-- La cara posterior (el revers daurat) -->
                <div class="back"></div>
            </div>
        </div>
    </div>

</body>
</html>
