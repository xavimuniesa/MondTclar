<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rellotge estil estació suïssa</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #000000;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(0.5rem, 2vh, 1.5rem) clamp(0.75rem, 3vw, 1.5rem);
    box-sizing: border-box;
    min-height: 100dvh;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.6rem, 2vh, 1.25rem);
    width: 100%;
    max-width: 420px;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.6vh, 14px);
    width: 100%;
  }
  .clock-case {
    background: linear-gradient(135deg, #3a3a3a 0%, #1c1c1c 45%, #0a0a0a 100%);
    border-radius: 50%;
    padding: clamp(4px, 0.8vmin, 7px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  }
  #clock {
    width: clamp(160px, 62vmin, 340px);
    height: clamp(160px, 62vmin, 340px);
    display: block;
  }
  #calHeader {
    text-align: center;
    font-size: clamp(19px, 4vmin, 30px);
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: clamp(6px, 1vh, 14px);
    color: #ffffff;
    text-transform: capitalize;
  }
  #calGrid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: clamp(4px, 1vmin, 10px);
    text-align: center;
    font-size: clamp(14px, 3vmin, 22px);
    width: 100%;
    color: #ffffff;
  }
  #calGrid div { padding: clamp(2px, 0.6vh, 7px) 0; border-radius: 6px; }
  .dow { font-size: clamp(11px, 2.4vmin, 17px); letter-spacing: 0.5px; color: #8a8a86; font-weight: 600; }
  .today { background: #d0102a; color: #ffffff; font-weight: 600; }

  /* Filera d'instruments: temperatura, altitud, humitat, localitzacio */
  .instruments {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(6px, 1.4vmin, 10px) clamp(10px, 2.4vmin, 18px);
    margin-top: 2px;
  }
  .instrument {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 52px;
  }
  .instLabel {
    font-size: clamp(8px, 1.6vmin, 10px);
    letter-spacing: 1px;
    color: #8a8a86;
    font-weight: 600;
    text-transform: uppercase;
  }
  .instValue {
    font-size: clamp(11px, 2.1vmin, 14px);
    font-weight: 600;
    color: #ffffff;
    margin-top: 2px;
  }

  /* Mobil en horitzontal: rellotge i calendari en linia, encara que l'amplada sigui inferior a 640px */
  @media (orientation: landscape) and (max-height: 500px) {
    .wrap {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      max-width: 760px;
      gap: clamp(1.25rem, 4vw, 2.5rem);
    }
    .col { width: auto; }
    #calGrid { min-width: 250px; }
    #clock {
      width: clamp(150px, 58vh, 320px);
      height: clamp(150px, 58vh, 320px);
    }
    #calHeader { font-size: clamp(18px, 4.5vh, 26px); }
    #calGrid { font-size: clamp(13px, 3.4vh, 19px); }
    .dow { font-size: clamp(10px, 2.4vh, 14px); }
  }

  /* En pantalles mes amples (tauleta/escriptori estret), rellotge i calendari en linia */
  @media (min-width: 640px) {
    .wrap {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      max-width: 860px;
      gap: clamp(1.5rem, 4vw, 3.5rem);
    }
    .col { width: auto; }
    #calGrid { min-width: 300px; }
  }

  /* En pantalles grans d'escriptori, tot el conjunt creix */
  @media (min-width: 1100px) and (min-height: 700px) {
    .wrap {
      max-width: min(92vw, 1600px);
      gap: clamp(3rem, 6vw, 8rem);
    }
    #clock {
      width: clamp(320px, 34vmin, 620px);
      height: clamp(320px, 34vmin, 620px);
    }
    #calHeader { font-size: clamp(26px, 3.2vmin, 42px); margin-bottom: clamp(16px, 2vmin, 26px); }
    #calGrid { font-size: clamp(18px, 2.6vmin, 32px); gap: clamp(8px, 1.2vmin, 16px); min-width: clamp(360px, 32vw, 620px); }
    .dow { font-size: clamp(14px, 2vmin, 23px); }
    .instLabel { font-size: clamp(11px, 1.2vmin, 14px); }
    .instValue { font-size: clamp(15px, 1.8vmin, 20px); }
    .instruments { gap: clamp(12px, 1.6vmin, 18px) clamp(20px, 2.6vmin, 32px); }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="col">
    <div class="clock-case">
      <svg id="clock" viewBox="0 0 200 200" role="img" aria-label="Rellotge estil estació suïssa">
        <defs>
          <radialGradient id="faceGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="70%" stop-color="#f7f7f5"/>
            <stop offset="100%" stop-color="#e8e8e4"/>
          </radialGradient>
          <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
            <feDropShadow dx="0" dy="1.1" stdDeviation="1" flood-color="#000000" flood-opacity="0.35"/>
          </filter>
        </defs>
        <circle cx="100" cy="100" r="96" fill="url(#faceGrad)" stroke="#1c1c1c" stroke-width="2"/>
        <g id="ticks" filter="url(#softShadow)"></g>
        <text x="100" y="48" text-anchor="middle" font-family="'Mondaine Helvetica', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.8" font-weight="500" letter-spacing="1.03" fill="#1c1c1c">DOMAINE</text>
        <g id="brandLogo" filter="url(#softShadow)">
          <rect x="73.25" y="53.65" width="11.2" height="7.7" fill="#d52b1e"/>
          <polygon points="78.85,55.05 78.85,59.95 73.95,57.5" fill="#ffffff"/>
          <polygon points="78.85,55.05 78.85,59.95 83.75,57.5" fill="#ffffff"/>
          <text x="86.55" y="59.95" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="5.25" font-weight="700" letter-spacing="0.28" fill="#1c1c1c">PSS MNN XML</text>
        </g>
        <rect id="hourHand" x="95.785" y="37" width="8.43" height="81" fill="#1c1c1c" filter="url(#softShadow)"/>
        <polygon id="minHand" points="96.07,118 96.07,100 96.33,8 103.68,8 103.93,100 103.93,118" fill="#1c1c1c" filter="url(#softShadow)"/>
        <g id="secGroup" filter="url(#softShadow)">
          <line x1="100" y1="118" x2="100" y2="30" stroke="#d0102a" stroke-width="2"/>
          <circle cx="100" cy="37" r="7" fill="#d0102a"/>
        </g>
        <circle cx="100" cy="100" r="5" fill="#1c1c1c" filter="url(#softShadow)"/>
      </svg>
    </div>
    <div class="instruments">
      <div class="instrument">
        <span class="instLabel">Temp</span>
        <span id="instTemp" class="instValue">--°C</span>
      </div>
      <div class="instrument">
        <span class="instLabel">Humit</span>
        <span id="instHum" class="instValue">--%</span>
      </div>
      <div class="instrument">
        <span class="instLabel">Alt</span>
        <span id="instAlt" class="instValue">-- m</span>
      </div>
      <div class="instrument">
        <span class="instLabel">Lloc</span>
        <span id="instLoc" class="instValue">--</span>
      </div>
    </div>
  </div>

  <div class="col" style="align-items: stretch;">
    <div id="calHeader">--</div>
    <div id="calGrid"></div>
  </div>

</div>

<script>
(function(){
  var svgNS = "http://www.w3.org/2000/svg";
  var ticks = document.getElementById('ticks');
  for (var i = 0; i < 60; i++) {
    var angle = i * 6 * Math.PI / 180;
    var isHour = i % 5 === 0;
    var r1 = isHour ? 72 : 84;
    var w = isHour ? 6 : 3;
    var len = isHour ? 20 : 8;
    var x1 = 100 + r1 * Math.sin(angle), y1 = 100 - r1 * Math.cos(angle);
    var x2 = 100 + (r1 + len) * Math.sin(angle), y2 = 100 - (r1 + len) * Math.cos(angle);
    var line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', '#1c1c1c');
    line.setAttribute('stroke-width', w);
    ticks.appendChild(line);
  }

  var diesSetmana = ["dl","dt","dc","dj","dv","ds","dg"];
  var diesLlarg = ["diumenge","dilluns","dimarts","dimecres","dijous","divendres","dissabte"];
  var mesos = ["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];

  function buildCalendar(now) {
    var year = now.getFullYear(), month = now.getMonth(), today = now.getDate();
    document.getElementById('calHeader').textContent = mesos[month] + " " + year;
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    diesSetmana.forEach(function(d){
      var el = document.createElement('div');
      el.textContent = d;
      el.className = 'dow';
      grid.appendChild(el);
    });
    var firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    for (var i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));
    for (var d = 1; d <= daysInMonth; d++) {
      var cell = document.createElement('div');
      cell.textContent = d;
      if (d === today) cell.className = 'today';
      grid.appendChild(cell);
    }
  }

  var lastDay = null;
  var lastDigitalSecond = null;

  function frame() {
    var now = new Date();
    var h = now.getHours() % 12, m = now.getMinutes();
    var s = now.getSeconds();
    var ms = now.getMilliseconds();
    var sFrac = s + ms / 1000;

    var sAngle;
    if (sFrac < 58) {
      sAngle = (sFrac / 58) * 360;
    } else {
      sAngle = 360;
    }

    var mAngle = m * 6;
    var hAngle = (h + m / 60) * 30;

    document.getElementById('hourHand').setAttribute('transform', 'rotate(' + hAngle + ' 100 100)');
    document.getElementById('minHand').setAttribute('transform', 'rotate(' + mAngle + ' 100 100)');
    document.getElementById('secGroup').setAttribute('transform', 'rotate(' + sAngle + ' 100 100)');

    if (s !== lastDigitalSecond) {
      lastDigitalSecond = s;
      if (lastDay !== now.getDate()) {
        lastDay = now.getDate();
        buildCalendar(now);
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* Temperatura, humitat, altitud i localització, a partir de la geolocalització del dispositiu */
  var instTemp = document.getElementById('instTemp');
  var instAlt = document.getElementById('instAlt');
  var instHum = document.getElementById('instHum');
  var instLoc = document.getElementById('instLoc');
  var lastCoords = null;

  function fetchWeather(lat, lon) {
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,relative_humidity_2m&timezone=auto')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data && data.current) {
          instTemp.textContent = Math.round(data.current.temperature_2m) + '°C';
          instHum.textContent = Math.round(data.current.relative_humidity_2m) + '%';
        }
      })
      .catch(function(){});
  }

  function fetchElevation(lat, lon) {
    fetch('https://api.open-meteo.com/v1/elevation?latitude=' + lat + '&longitude=' + lon)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data && data.elevation && data.elevation.length) {
          instAlt.textContent = Math.round(data.elevation[0]) + ' m';
        }
      })
      .catch(function(){});
  }

  function fetchLocationName(lat, lon) {
    fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=ca')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data) {
          var name = data.locality || data.city || data.principalSubdivision || data.countryName || '--';
          instLoc.textContent = name;
        }
      })
      .catch(function(){});
  }

  function refreshAll(lat, lon) {
    fetchWeather(lat, lon);
    fetchElevation(lat, lon);
    fetchLocationName(lat, lon);
  }

  function requestLocationAndData() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      function(pos){
        lastCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        /* Si el dispositiu proporciona altitud GPS real (mòbils amb GPS), la fem servir en lloc de l'elevació del terreny */
        if (pos.coords.altitude !== null && pos.coords.altitude !== undefined && !isNaN(pos.coords.altitude)) {
          instAlt.textContent = Math.round(pos.coords.altitude) + ' m';
        } else {
          fetchElevation(lastCoords.lat, lastCoords.lon);
        }
        fetchWeather(lastCoords.lat, lastCoords.lon);
        fetchLocationName(lastCoords.lat, lastCoords.lon);
      },
      function(){ /* permís denegat o error: es mantenen els guions */ },
      { timeout: 10000, maximumAge: 600000 }
    );
  }

  requestLocationAndData();
  setInterval(function(){
    if (lastCoords) refreshAll(lastCoords.lat, lastCoords.lon);
    else requestLocationAndData();
  }, 15 * 60 * 1000);
})();
</script>

</body>
</html>
