<style>
  :root{ --fade:2.5s; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0b1022;-webkit-tap-highlight-color:transparent}
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block}
  .layer{position:fixed;inset:0;width:100%;height:100%;overflow:visible;display:block;will-change:transform;transform-origin:50% 72%;pointer-events:none}
  #sky{will-change:transform;transform:scale(1.06)}
  .win{opacity:0;transition:opacity var(--fade) ease}
  .win.on{opacity:1}
  #glowsBack,#glowsFront,#lampGlows{mix-blend-mode:screen}

  #panel{
    position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));
    padding:8px 13px 9px;border-radius:12px;
    background:rgba(12,16,28,.4);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);
    color:#f4efe4;font-family:Inter,system-ui,-apple-system,sans-serif;
    border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:5;user-select:none;
    display:flex;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums;white-space:nowrap
  }
  #tDate{font-size:12px;opacity:.75}
  #tTime{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:26px;line-height:1}
  #tBell{font-size:13px;cursor:pointer;opacity:.85;pointer-events:auto}
  #tTemp{font-size:14px;font-weight:500;color:#ffd9a0}
</style>

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const LAT = 47.3707, LON = 8.5409;       // Sant Pere, Zúric
const RAD = Math.PI / 180;
const $ = id => document.getElementById(id);
function E(tag, a, parent){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry32(20260928);
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function lerpKeys(keys, x){
  if (x <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++){
    if (x <= keys[i][0]){
      const [x0, ...a] = keys[i-1], [x1, ...b] = keys[i], t = (x - x0) / (x1 - x0);
      return a.map((v, j) => Array.isArray(v) ? v.map((w, k) => lerp(w, b[j][k], t)) : lerp(v, b[j], t));
    }
  }
  return keys[keys.length-1].slice(1);
}

/* ---------- Time (Zurich) ---------- */
const fmt = new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/Zurich', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' });
const fmtDate = new Intl.DateTimeFormat('ca', { timeZone:'Europe/Zurich', weekday:'long', day:'numeric', month:'long' });
function zParts(ms){
  const p = fmt.formatToParts(new Date(ms)); const o = {};
  for (const x of p) if (x.type !== 'literal') o[x.type] = +x.value;
  return { h:o.hour % 24, m:o.minute, s:o.second, ms: ((ms % 1000) + 1000) % 1000 };
}
const pad = n => String(n).padStart(2, '0');

let live = true, speed = 1, anchorReal = performance.now(), anchorSim = Date.now();
function simNow(){ return live ? Date.now() : anchorSim + (performance.now() - anchorReal) * speed; }
function reanchor(ms){ anchorSim = ms; anchorReal = performance.now(); }

/* ---------- Astronomy ---------- */
function altAz(ms, ra, dec){
  const d = (ms - 946728000000) / 86400000;
  const gmst = (280.46061837 + 360.98564736629 * d) % 360;
  const ha = (gmst + LON) * RAD - ra, lat = LAT * RAD;
  const alt = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha));
  const az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(lat) - Math.tan(dec) * Math.cos(lat));
  return { alt: alt / RAD, az: (az / RAD + 540) % 360 };
}
function sunPos(ms){
  const d = (ms - 946728000000) / 86400000;
  const g = (357.529 + 0.98560028 * d) * RAD, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * RAD;
  const e = (23.439 - 0.00000036 * d) * RAD;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));
  return Object.assign(altAz(ms, ra, dec), { ra, dec });
}
function moonPos(ms, sun){
  const phase = (((ms - Date.UTC(2000,0,6,18,14)) / 86400000) % 29.530588 + 29.530588) % 29.530588 / 29.530588;
  const ra = sun.ra + phase * 2 * Math.PI, dec = sun.dec * Math.cos(phase * 2 * Math.PI);
  return Object.assign(altAz(ms, ra, dec), { phase });
}
let rsCache = { key:null };
function riseSet(ms){
  const z = zParts(ms), mid = ms - ((z.h * 60 + z.m) * 60 + z.s) * 1000 - z.ms;
  const key = Math.round(mid / 60000);
  if (rsCache.key === key) return rsCache;
  let rise = null, set = null, prev = sunPos(mid).alt; const H = -0.833, step = 300000;
  for (let t = mid + step; t <= mid + 86400000; t += step){
    const a = sunPos(t).alt, f = (H - prev) / (a - prev);
    if (prev < H && a >= H) rise = t - step + f * step;
    if (prev >= H && a < H) set = t - step + f * step;
    prev = a;
  }
  return rsCache = { key, rise, set, mid };
}
const hm = ms => { if (ms == null) return '—'; const z = zParts(ms); return pad(z.h) + ':' + pad(z.m); };

/* ---------- Build scene ---------- */
// stone courses
for (let y = 840; y < 1820; y += 26) E('line', { x1:358, y1:y, x2:582, y2:y }, $('stoneLines'));
// numerals (radial, like the real dial)
['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'].forEach((n, i) => {
  E('text', { x:470, y:918 - 86, transform:`rotate(${i * 30} 470 918)` }, $('numerals')).textContent = n;
});

const wins = [];
const WARM = ['#ffd98a','#ffc868','#ffe2ad','#ffcf7e','#ffbe60','#fff0c8'];
function addWin(glass, glowG, paneG, x, y, w, h, o = {}){
  const frame = o.frame || '#efe9dc';
  if (o.shutter){
    const sw = w * 0.52;
    for (const sx of [x - sw - 3, x + w + 3]){
      E('rect', { x:sx, y:y - 2, width:sw, height:h + 4, fill:o.shutter }, glass);
      E('rect', { x:sx, y:y - 2, width:sw, height:h + 4, fill:'url(#louver)' }, glass);
    }
  }
  E('rect', { x, y, width:w, height:h, fill:'url(#gGlass)', stroke:frame, 'stroke-width':2.5 }, glass);
  E('path', { d:`M${x + w/2} ${y}V${y + h}M${x} ${y + h*.42}H${x + w}`, stroke:frame, 'stroke-width':1.6 }, glass);

  const glow = E('rect', { x:x - w * 1.2, y:y - h * .6, width:w * 3.4, height:h * 2.2, fill:'url(#gWinGlow)', class:'win' }, glowG);
  const pane = E('g', { class:'win' }, paneG);
  const col = WARM[Math.floor(R() * WARM.length)];
  const p = E('rect', { x:x + 1.5, y:y + 1.5, width:w - 3, height:h - 3, fill:col }, pane);
  if (R() < .55){
    const cw = (w - 3) * (.2 + R() * .15);
    E('rect', { x:x + 1.5, y:y + 1.5, width:cw, height:h - 3, fill:'#7a3b10', opacity:.28 }, pane);
    E('rect', { x:x + w - 1.5 - cw, y:y + 1.5, width:cw, height:h - 3, fill:'#7a3b10', opacity:.28 }, pane);
  }
  E('path', { d:`M${x + w/2} ${y}V${y + h}M${x} ${y + h*.42}H${x + w}`, stroke:'#3b2a1c', 'stroke-width':1.6 }, pane);
  wins.push({ glow, pane, p, col,
    onAlt: -0.3 - R() * 6.5,
    bed: 21.6 + R() * 4,           // hora d'anar a dormir (pot passar de mitjanit)
    wake: 5.3 + R() * 2.2,
    never: R() < .15, tv: R() < .07, on:false });
}

// Back windows
{
  const g = $('backWins'), gg = $('glowsBack'), pg = $('panesBack');
  for (const y of [1380, 1520, 1665]) addWin(g, gg, pg, 315, y, 26, 52);
  // dormers
  const d = $('dormers');
  for (const cx of [548, 666]){
    E('rect', { x:cx - 26, y:1352, width:52, height:66, fill:'#ecebe6' }, d);
    E('path', { d:`M${cx - 33} 1358 L${cx} 1326 L${cx + 33} 1358 Z`, fill:'#4b5058' }, d);
    addWin(d, gg, pg, cx - 15, 1364, 30, 46);
  }
  for (const y of [1505, 1650]) for (const x of [582, 652]) addWin(g, gg, pg, x, y, 36, 64, { shutter:'#c9c9c3' });
  for (const y of [1500, 1650]) for (const x of [770, 830]) addWin(g, gg, pg, x, y, 30, 60, { shutter:'#b9bdb8' });
  for (const y of [1470, 1600, 1725]) for (const x of [440, 512]) addWin(g, gg, pg, x, y, 30, 56, { shutter:'#d4d3cd' });
}
// Front windows
{
  const g = $('frontWins'), gg = $('glowsFront'), pg = $('panesFront');
  for (let k = 0; k < 8; k++){
    const bx = 150 - k * 190;
    for (let i = 0; i < 4; i++) for (const y of [1300, 1610]) addWin(g, gg, pg, bx + i * 29, y, 22, 125, { frame:'#f3ece0' });
  }
  for (let x = 912; x < 2150; x += 120)
    for (let y = -760; y < 1700; y += 175) addWin(g, gg, pg, x, y, 40, 84, { shutter:'#66776a' });
}
// Lamps
const lamps = [[110,1470],[-420,1470],[-900,1470],[602,1462],[902,1478],[1560,1500],[2000,1500]];
for (const [x, y] of lamps){
  const f = $('lampFix');
  E('path', { d:`M${x-6} ${y-48} h30 v4 h-30z`, fill:'#2b2b2b' }, f);
  E('line', { x1:x+14, y1:y-44, x2:x+14, y2:y-38, stroke:'#2b2b2b', 'stroke-width':2 }, f);
  E('path', { d:`M${x+5} ${y-38} L${x+23} ${y-38} L${x+27} ${y-30} L${x+24} ${y-6} L${x+4} ${y-6} L${x+1} ${y-30} Z`, fill:'#2a2a2a' }, f);
  E('rect', { x:x+7, y:y-30, width:14, height:21, fill:'#e9dcc0', opacity:.55 }, f);
  const lg = $('lampGlows'), cx = x + 14, cy = y - 20;
  E('ellipse', { cx, cy:cy + 90, rx:110, ry:170, fill:'url(#gLamp)', opacity:.55 }, lg);
  E('circle', { cx, cy, r:190, fill:'url(#gLamp)' }, lg);
  E('rect', { x:x+7, y:y-30, width:14, height:21, fill:'#fff3cf' }, lg);
}
// Tree & climbing ivy
{
  const t = $('Ltree');
  const clusters = [[985,160,80],[955,380,100],[978,600,110],[935,830,130],[1010,1060,200],[860,1300,200],
    [700,1150,90],[628,1085,55],[760,1560,210],[995,1600,260],[1200,1250,240],[1320,1650,260],[1470,1420,200],[655,1725,120]];
  const pal = ['#24451a','#2f5a1e','#3d7327','#4f8a2e','#62a038','#7fb548','#9cc95e'];
  for (const [cx, cy, r] of clusters) E('circle', { cx, cy, r:r * .82, fill:'#1f3b16' }, t);
  for (const [cx, cy, r] of clusters){
    const n = Math.round(r * 1.1);
    for (let i = 0; i < n; i++){
      const a = R() * Math.PI * 2, d = r * Math.sqrt(R());
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * .9;
      const light = clamp(.5 - (y - cy) / (2 * r) - (x - cx) / (4 * r) + (R() - .5) * .6);
      const col = pal[Math.min(pal.length - 1, Math.floor(light * pal.length))];
      const lr = 7 + R() * 12;
      E('ellipse', { cx:x.toFixed(1), cy:y.toFixed(1), rx:lr.toFixed(1), ry:(lr * .58).toFixed(1), fill:col,
        transform:`rotate(${(R() * 180).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})` }, t);
    }
  }
}

/* ---------- Sky canvas ---------- */
const cv = $('sky'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, sc = 1, offX = 0, offY = 0;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sc = Math.min(W / 1000, H / 1800); offX = (W - 1000 * sc) / 2; offY = H - 1800 * sc;
}
addEventListener('resize', resize); resize();
const vb = (x, y) => [offX + x * sc, offY + y * sc];
// l'horitzó real queda amagat darrere les teulades; el sol alt surt per sobre del marc
const skyPos = (alt, az) => vb(470 + (az - 160) * 5.5, 1150 - alt * 32);

const stars = Array.from({ length: 340 }, () => ({ x:R(), y:Math.pow(R(), 1.3) * .8, r:.4 + Math.pow(R(), 3) * 1.6, p:R() * 6.28, s:.5 + R() * 2 }));
const clouds = Array.from({ length: 6 }, () => ({ x0:R() * 1.3, y:.06 + R() * .36, s:.6 + R() * .9, v:.5 + R(),
  puffs: Array.from({ length: 7 }, () => ({ dx:(R() - .5) * 2.4, dy:(R() - .5) * .5, r:.45 + R() * .6 })) }));

const SKY = [
  [-90,[4,6,14],[8,11,24]], [-18,[4,6,16],[10,14,32]], [-12,[8,12,34],[26,30,64]], [-8,[14,22,60],[56,54,98]],
  [-4,[26,44,102],[156,98,122]], [-1,[48,84,152],[238,140,98]], [2,[70,112,182],[250,172,112]], [6,[72,130,205],[244,208,162]],
  [12,[62,136,220],[192,219,240]], [30,[44,122,224],[160,204,244]], [90,[30,108,220],[140,194,242]] ];
const CLOUD = [[-90,[30,36,58],.3],[-12,[40,46,72],.35],[-6,[120,90,130],.5],[-2,[240,140,120],.6],[2,[255,190,150],.7],[8,[255,240,230],.75],[20,[255,255,255],.8]];
const rgb = (c, a = 1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

function drawMoon(x, y, r, phase){
  ctx.save(); ctx.translate(x, y);
  let p = phase; if (p > .5){ ctx.scale(-1, 1); p = 1 - p; }
  ctx.fillStyle = 'rgba(70,78,100,.35)'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  const k = Math.cos(p * 2 * Math.PI);
  ctx.fillStyle = '#f3efe0'; ctx.shadowColor = 'rgba(230,235,255,.8)'; ctx.shadowBlur = r * 1.2;
  ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
  ctx.ellipse(0, 0, Math.max(.01, r * Math.abs(k)), r, 0, Math.PI / 2, -Math.PI / 2, k > 0);
  ctx.fill(); ctx.restore();
}

function drawSky(ms, sun, moon){
  const [top, hor] = lerpKeys(SKY, sun.alt);
  const horY = vb(0, 1450)[1];
  const g = ctx.createLinearGradient(0, 0, 0, horY);
  g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(hor));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = rgb(hor); ctx.fillRect(0, horY, W, H - horY);

  let [sx, sy] = skyPos(sun.alt, sun.az);
  const gy = Math.min(sy, horY);
  const ga = .62 * Math.exp(-Math.pow((sun.alt + 1) / 5.5, 2));
  if (ga > .01){
    const rg = ctx.createRadialGradient(sx, gy, 0, sx, gy, Math.max(W, H) * .8);
    rg.addColorStop(0, `rgba(255,150,80,${ga})`); rg.addColorStop(.4, `rgba(255,110,90,${ga * .35})`); rg.addColorStop(1, 'rgba(255,100,80,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  // stars
  const sv = smooth(-5, -14, sun.alt);
  if (sv > .01){
    const t = performance.now() / 1000;
    ctx.fillStyle = '#fff';
    for (const s of stars){
      ctx.globalAlpha = sv * (.55 + .45 * Math.sin(t * s.s + s.p));
      ctx.beginPath(); ctx.arc(s.x * W, s.y * horY, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // moon
  const moonVis = smooth(-1, -6, sun.alt);      // la lluna només apareix quan el sol s'ha post
  if (moon.alt > -2 && moonVis > .01){
    const [mx, my] = skyPos(moon.alt, moon.az);
    ctx.globalAlpha = moonVis;
    drawMoon(mx, my, 17 * sc + 4, moon.phase);
    ctx.globalAlpha = 1;
  }
  // sun
  if (sun.alt > -3){
    const low = smooth(14, 0, sun.alt);
    const core = [255, lerp(250, 150, low), lerp(225, 70, low)];
    const rr = (20 * sc + 5), halo = Math.max(W, H) * lerp(.55, .35, low);
    // resplendor ampli (enlluerna, no és un disc pàl·lid)
    let rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, halo);
    rg.addColorStop(0, rgb([255, 250, 225], lerp(.75, .6, low))); rg.addColorStop(.08, rgb(core, .35));
    rg.addColorStop(.3, rgb(core, .12)); rg.addColorStop(1, rgb(core, 0));
    ctx.fillStyle = rg; ctx.fillRect(sx - halo, sy - halo, halo * 2, halo * 2);
    rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, rr * 1.6);
    rg.addColorStop(0, '#fffef8'); rg.addColorStop(.6, rgb([255, lerp(252, 200, low), lerp(235, 130, low)]));
    rg.addColorStop(1, rgb([255, lerp(245, 170, low), lerp(200, 90, low)], 0));
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(sx, sy, rr * 1.6, 0, 6.283); ctx.fill();
  }
  // clouds
  const [cc, ca] = lerpKeys(CLOUD, sun.alt);
  const base = Math.min(W, H) * .07;
  for (const c of clouds){
    const x = ((c.x0 + ms / 1000 * .000018 * c.v) % 1.5 - .25) * W, y = c.y * horY;
    for (const p of c.puffs){
      const px = x + p.dx * base * c.s, py = y + p.dy * base * c.s, pr = p.r * base * c.s;
      const rg = ctx.createRadialGradient(px, py, 0, px, py, pr);
      rg.addColorStop(0, rgb(cc, ca * .5)); rg.addColorStop(.6, rgb(cc, ca * .22)); rg.addColorStop(1, rgb(cc, 0));
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(px, py, pr, 0, 6.283); ctx.fill();
    }
  }
}

/* ---------- Lighting ---------- */
const TINT = [[-90,[.12,.14,.26,.4]],[-18,[.12,.14,.26,.4]],[-10,[.16,.18,.32,.45]],[-6,[.26,.27,.42,.55]],
  [-3,[.45,.42,.58,.7]],[0,[.78,.6,.6,.85]],[3,[1,.8,.68,1]],[8,[1.05,.95,.85,1.05]],[20,[1,1,.98,1.05]],[90,[1.02,1.02,1,1.05]]];
function matrix([r, g, b, s]){
  const lr = .2126 * (1 - s), lg = .7152 * (1 - s), lb = .0722 * (1 - s);
  const f = v => v.toFixed(4);
  return [f((lr + s) * r), f(lg * r), f(lb * r), 0, 0,
          f(lr * g), f((lg + s) * g), f(lb * g), 0, 0,
          f(lr * b), f(lg * b), f((lb + s) * b), 0, 0, 0, 0, 0, 1, 0].join(' ');
}
let lastTintKey = '';
function updateTint(alt){
  const t = lerpKeys(TINT, alt)[0];
  const lamp = smooth(-0.5, -4.5, alt);
  const flood = [.98, .82, .6, .9];
  const tw = t.map((v, i) => lerp(v, Math.max(v, flood[i]), lamp * .85));
  const key = t.map(v => v.toFixed(3)).join() + lamp.toFixed(3);
  if (key === lastTintKey) return;
  lastTintKey = key;
  const m = matrix(t);
  for (const id of ['mFar','mBack','mWorld','mTree']) $(id).setAttribute('values', m);
  $('mTower').setAttribute('values', matrix(tw));
  const hz = rgb(lerpKeys(SKY, alt)[1]);
  document.querySelectorAll('feFlood.haze').forEach(f => f.setAttribute('flood-color', hz));
  $('lampGlows').setAttribute('opacity', lamp.toFixed(3));
}
function asleep(w, h){
  const bed = w.bed % 24;
  return bed > w.wake ? (h >= bed || h < w.wake) : (h >= bed && h < w.wake);
}
function updateLights(alt, h){
  for (const w of wins){
    const on = !w.never && alt < w.onAlt && !asleep(w, h);
    if (on !== w.on){ w.on = on; w.glow.classList.toggle('on', on); w.pane.classList.toggle('on', on); }
  }
}
setInterval(() => {
  for (const w of wins) if (w.tv && w.on){
    const v = Math.random();
    w.p.setAttribute('fill', v < .5 ? '#9fb6ff' : v < .8 ? '#c9d6ff' : '#7f95e0');
  }
}, 170);

/* ---------- Bells ---------- */
let A = null, bus = null, bellsOn = false, noiseBuf = null;
function initAudio(){
  if (A) return;
  A = new (window.AudioContext || window.webkitAudioContext)();
  const comp = A.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(A.destination);
  const master = A.createGain(); master.gain.value = .8; master.connect(comp);
  bus = A.createGain(); bus.connect(master);
  const len = A.sampleRate * 4, ir = A.createBuffer(2, len, A.sampleRate);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  const conv = A.createConvolver(); conv.buffer = ir;
  const wet = A.createGain(); wet.gain.value = .38; bus.connect(conv); conv.connect(wet); wet.connect(master);
  noiseBuf = A.createBuffer(1, A.sampleRate * .15, A.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
const PARTIALS = [[.5,1,1],[1,.7,.75],[1.183,.5,.55],[1.506,.3,.45],[2,.55,.4],[2.514,.22,.3],[2.662,.15,.25],[3.011,.18,.22],[4.166,.08,.15],[5.433,.05,.1]];
function bell(t, f, vol, dur){
  const out = A.createGain(); out.gain.value = vol; out.connect(bus);
  for (const [r, a, d] of PARTIALS){
    for (const det of [0, 1]){
      const o = A.createOscillator(), g = A.createGain();
      o.frequency.value = f * r + det * (r < 1.1 ? .9 : .45);
      const amp = a * (det ? .45 : 1) * .16, end = t + dur * d;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(amp, t + .005); g.gain.exponentialRampToValueAtTime(.0001, end);
      o.connect(g); g.connect(out); o.start(t); o.stop(end + .05);
    }
  }
  const n = A.createBufferSource(); n.buffer = noiseBuf;
  const bp = A.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * 4; bp.Q.value = 1.5;
  const ng = A.createGain(); ng.gain.setValueAtTime(.3, t); ng.gain.exponentialRampToValueAtTime(.0001, t + .09);
  n.connect(bp); bp.connect(ng); ng.connect(out); n.start(t); n.stop(t + .12);
}
function chime(q, hour, at){
  if (!A) return;
  if (A.state === 'suspended') A.resume();
  let t = at ?? A.currentTime + .15;
  const n = q === 0 ? 4 : q;
  for (let i = 0; i < n; i++){ bell(t, 392, .55, 5); bell(t + .85, 329.6, .55, 5.5); t += 2.1; }
  if (q === 0){ t += 1.6; for (let i = 0; i < hour; i++){ bell(t, 196, 1, 10); t += 2.7; } }
}
function chimeFor(qKey){
  const z = zParts(qKey * 900000);
  const q = Math.round(z.m / 15) % 4;
  chime(q, (z.h % 12) || 12);
}

// Programa el proper quart sobre el rellotge d'àudio, amb antelació.
// Així sona puntual encara que la pestanya estigui en segon pla (on els temporitzadors s'alenteixen).
let scheduledQ = null;
function scheduleBells(){
  if (!bellsOn || !A) return;
  if (A.state === 'suspended') A.resume();
  const now = Date.now(), nextQ = Math.ceil(now / 900000);
  const wait = (nextQ * 900000 - now) / 1000;
  if (nextQ !== scheduledQ && wait < 90 && A.state === 'running'){
    scheduledQ = nextQ;
    const z = zParts(nextQ * 900000), q = Math.round(z.m / 15) % 4;
    chime(q, (z.h % 12) || 12, A.currentTime + wait);
  }
}
setInterval(scheduleBells, 1000);

/* ---------- UI ---------- */
// Els navegadors només permeten so després d'una interacció: el primer toc activa les campanes.
const bellIcon = $('tBell');
function setBells(on){
  bellsOn = on; bellIcon.textContent = on ? '🔔' : '🔕';
  bellIcon.title = on ? 'Campanes activades (toca per silenciar)' : 'Toca per activar les campanes';
  if (on) scheduleBells();
}
function unlock(){
  initAudio(); if (A.state === 'suspended') A.resume(); askTilt();
  if (!bellsOn) setBells(true);
  removeEventListener('pointerdown', unlock); removeEventListener('keydown', unlock);
}
addEventListener('pointerdown', unlock); addEventListener('keydown', unlock);
bellIcon.addEventListener('click', e => { if (A) setBells(!bellsOn); });
document.addEventListener('visibilitychange', () => { if (A && A.state === 'suspended') A.resume(); });
setBells(false);
const fmtShort = new Intl.DateTimeFormat('ca', { timeZone:'Europe/Zurich', weekday:'short', day:'numeric', month:'short' });

// Temperatura actual a Zúric (Open-Meteo)
async function loadTemp(){
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m&timezone=Europe%2FZurich`);
    const j = await r.json();
    $('tTemp').textContent = Math.round(j.current.temperature_2m) + ' °C';
  }catch(e){ /* manté el valor anterior */ }
}
loadTemp(); setInterval(loadTemp, 10 * 60 * 1000);

/* ---------- Perspective / parallax ---------- */
const layers = [...document.querySelectorAll('.layer')].map(el => ({ el, d: +el.dataset.depth }));
const cam = { x:0, y:0, tx:0, ty:0, last:-1e9 };
addEventListener('pointermove', e => { cam.tx = e.clientX / innerWidth * 2 - 1; cam.ty = e.clientY / innerHeight * 2 - 1; cam.last = performance.now(); });
addEventListener('pointerleave', () => { cam.last = -1e9; });
function onTilt(e){
  if (e.gamma == null) return;
  cam.tx = clamp(e.gamma / 25, -1, 1); cam.ty = clamp((e.beta - 50) / 25, -1, 1); cam.last = performance.now();
}
addEventListener('deviceorientation', onTilt);
function askTilt(){
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')
    DeviceOrientationEvent.requestPermission().catch(() => {});
}
function updateCamera(now){
  if (now - cam.last > 3500){               // deriva lenta quan ningú no interactua
    const t = now / 1000;
    cam.tx = Math.sin(t * .11) * .75 + Math.sin(t * .047) * .25;
    cam.ty = Math.sin(t * .073 + 1.3) * .5;
  }
  cam.x += (cam.tx - cam.x) * .045; cam.y += (cam.ty - cam.y) * .045;
  const mx = Math.min(innerWidth, innerHeight) * .05, my = mx * .45;
  for (const L of layers){
    const s = 1 + L.d * .035;
    L.el.style.transform = `translate3d(${(-cam.x * L.d * mx).toFixed(2)}px,${(-cam.y * L.d * my).toFixed(2)}px,0) scale(${s.toFixed(4)})`;
  }
  cv.style.transform = `translate3d(${(-cam.x * .02 * mx).toFixed(2)}px,${(-cam.y * .02 * my).toFixed(2)}px,0) scale(1.06)`;
}

/* ---------- Main loop ---------- */
const hH = $('hH'), hM = $('hM');
let lastTint = 0, lastLights = 0, lastUI = 0;
function frame(now){
  const ms = simNow(), z = zParts(ms);
  const hLocal = z.h + z.m / 60 + (z.s + z.ms / 1000) / 3600;
  const sun = sunPos(ms), moon = moonPos(ms, sun);

  const minA = (z.m + (z.s + z.ms / 1000) / 60) * 6;
  const hourA = ((z.h % 12) + z.m / 60 + z.s / 3600) * 30;
  hM.setAttribute('transform', `translate(470 918) rotate(${minA.toFixed(2)})`);
  hH.setAttribute('transform', `translate(470 918) rotate(${hourA.toFixed(2)})`);

  drawSky(ms, sun, moon);
  updateCamera(now);
  if (now - lastTint > (speed > 1 ? 110 : 1000) || lastTint === 0){ updateTint(sun.alt); lastTint = now; }
  if (now - lastLights > 400 || lastLights === 0){ updateLights(sun.alt, hLocal); lastLights = now; }


  if (now - lastUI > 250){
    lastUI = now;
    $('tTime').textContent = pad(z.h) + ':' + pad(z.m);
    $('tDate').textContent = (d => d.charAt(0).toUpperCase() + d.slice(1))(fmtShort.format(new Date(ms)).replace(/ de /g, ' '));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
