<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brúixola 3D Sòlida - Cilindre Real</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e8e8e8;
            overflow: hidden;
            font-family: sans-serif;
        }

        .scene {
            width: 400px;
            height: 400px;
            perspective: 1500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El contenidor que gira */
        .compass-3d {
            width: 280px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            animation: girar 7s linear infinite;
            transform: rotateY(0deg);
        }

        /* --- 1. LA CARA FRONTAL (L'esfera de la brúixola) --- */
        .face-front {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* Aquí posem la imatge de la brúixola. Si no tens la teva, aquesta funciona */
            background: 
                radial-gradient(circle at 30% 30%, #fff8dc 0%, #fceabb 20%, #d4af37 50%, #b8860b 80%, #6b4c05 100%);
            border: 4px solid #d4af37;
            box-sizing: border-box;
            transform: translateZ(15px);
            backface-visibility: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
            z-index: 3;
        }

        /* Detall de l'esfera (simula l'agulla i les marques) */
        .face-front::after {
            content: 'N';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #8b6508;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 1px 1px 0 #fff8dc;
        }

        /* --- 2. LA CARA POSTERIOR (El revers sòlid daurat) --- */
        .face-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 60% 40%, #fceabb, #d4af37, #b8860b, #6b4c05);
            border: 4px solid #b8860b;
            box-sizing: border-box;
            transform: rotateY(180deg) translateZ(15px);
            backface-visibility: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
            z-index: 2;
        }

        /* --- 3. EL GRUIX LATERAL (Les parets del cilindre) --- */
        /* Creem DUES parets rectangulars que formen el cos massís */
        .cylinder-wall {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            pointer-events: none;
            z-index: 1;
        }

        /* Paret davantera del cilindre (la que veuràs de perfil) */
        .cylinder-wall::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Aquest és el gruix: una paret amb degradat metàl·lic */
            background: linear-gradient(to bottom, 
                #b8860b 0%, 
                #fceabb 15%, 
                #d4af37 50%, 
                #fceabb 85%, 
                #b8860b 100%);
            border-radius: 50% / 10%; /* Això arrodoneix la paret per simular la corba */
            transform: rotateX(90deg) translateZ(15px);
            transform-origin: center;
            opacity: 0.95;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* Paret posterior del cilindre (per darrere) */
        .cylinder-wall::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, 
                #b8860b 0%, 
                #fceabb 15%, 
                #d4af37 50%, 
                #fceabb 85%, 
                #b8860b 100%);
            border-radius: 50% / 10%;
            transform: rotateX(-90deg) translateZ(15px);
            transform-origin: center;
            opacity: 0.95;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* --- 4. LA NANSA --- */
        .handle {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            width: 30px;
            height: 30px;
            border: 5px solid #d4af37;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            background: transparent;
            z-index: 0;
        }

        @keyframes girar {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="compass-3d">
            <!-- El gruix lateral (les parets del cilindre) -->
            <div class="cylinder-wall"></div>
            
            <!-- La cara frontal de la brúixola -->
            <div class="face-front"></div>
            
            <!-- El revers sòlid daurat -->
            <div class="face-back"></div>
            
            <!-- La nansa superior -->
            <div class="handle"></div>
        </div>
    </div>

</body>
</html>
