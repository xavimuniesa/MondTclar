<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brúixola 3D Realista - Gir 360º</title>
    <style>
        /* Configuració bàsica */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e8e8e8;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Contenidor principal: dóna la perspectiva 3D */
        .scene {
            width: 400px;
            height: 400px;
            perspective: 1500px; /* Perspectiva per notar la profunditat */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Aquest contenidor gira. Aquí dins hi ha TOTES les parts de la brúixola */
        .compass-3d {
            width: 280px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            /* Animació: 7 segons, lineal, infinita */
            animation: girar 7s linear infinite;
            /* Punt de partida: perfectament frontal */
            transform: rotateY(0deg); 
        }

        /* --- 1. LA CAIXA (El cilindre daurat) --- */
        /* Creem el gruix del cilindre simulant una forma amb múltiples capes */
        .case-cylinder {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transform-style: preserve-3d;
            /* El fons daurat de la caixa */
            background: radial-gradient(circle at 30% 30%, #fceabb, #d4af37, #b8860b, #8b6508);
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.6),
                0 0 20px rgba(0,0,0,0.4);
        }

        /* Capes de gruix per simular el cilindre (les vores) */
        .case-edge {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #b8860b;
            box-sizing: border-box;
            transform-style: preserve-3d;
        }

        /* --- 2. LA CARA FRONTAL (L'esfera de la brúixola) --- */
        .face-front {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* Imatge realista de brúixola */
            background-image: url('https://i.imgur.com/8YwJ5wT.png'); 
            background-size: cover;
            background-position: center;
            border: 6px solid #d4af37; /* Marc daurat exterior */
            box-sizing: border-box;
            /* La posem una mica endavant per donar gruix */
            transform: translateZ(15px);
            backface-visibility: hidden; /* Amaguem la part del darrere d'aquesta capa */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            z-index: 2;
        }

        /* Efecte de vidre sobre l'esfera */
        .glass-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 100%);
            transform: translateZ(16px); /* Just per sobre de la cara */
            pointer-events: none;
            z-index: 3;
        }

        /* --- 3. EL REVERS (Cara posterior sòlida) --- */
        .face-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* Metall daurat sòlid */
            background: radial-gradient(circle at 70% 30%, #fceabb, #d4af37, #b8860b, #6b4c05);
            border: 6px solid #b8860b;
            box-sizing: border-box;
            /* El girem 180º perquè miri cap enrere */
            transform: rotateY(180deg) translateZ(15px);
            backface-visibility: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            z-index: 2;
        }

        /* Anell decoratiu al revers perquè no sigui pla */
        .face-back::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            border: 2px dashed rgba(139, 101, 8, 0.6);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        /* --- 4. LA NANSA (Anella superior) --- */
        .handle {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%) translateZ(0); /* Al centre del cilindre */
            width: 30px;
            height: 30px;
            border: 6px solid #d4af37;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            background: transparent;
            z-index: 0;
        }

        /* Animació de gir */
        @keyframes girar {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

    </style>
</head>
<body>

    <div class="scene">
        <div class="compass-3d">
            
            <!-- La caixa (el cilindre de fons) -->
            <div class="case-cylinder"></div>
            
            <!-- El gruix lateral (les vores daurades) -->
            <div class="case-edge" style="transform: translateZ(0px);"></div>
            <div class="case-edge" style="transform: translateZ(5px);"></div>
            <div class="case-edge" style="transform: translateZ(10px);"></div>
            
            <!-- La cara frontal (l'esfera de la brúixola) -->
            <div class="face-front"></div>
            
            <!-- El reflex de vidre -->
            <div class="glass-overlay"></div>
            
            <!-- El revers sòlid daurat -->
            <div class="face-back"></div>
            
            <!-- La nansa superior -->
            <div class="handle"></div>

        </div>
    </div>

</body>
</html>
