  fog:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h18M5 12h14M3 16h18M7 20h10"/></svg>`,
  snow: `<svg viewBox="0 0 24 24" fill="none" style="stroke:var(--ico-a)" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9.5 3.6 12 6l2.5-2.4M9.5 20.4 12 18l2.5 2.4"/></svg>`,
  place:`<svg viewBox="0 0 24 24"><path d="M12 22s7.5-7.6 7.5-12.7a7.5 7.5 0 0 0-15 0C4.5 14.4 12 22 12 22z" fill="none" style="stroke:var(--ico-a)" stroke-width="1.8"/><circle cx="12" cy="9.4" r="2.7" style="fill:var(--ico-a)"/></svg>`,
  alt:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M1.5 20.5 9 7l4.5 7.5 3-4.5 6 10.5z"/><path d="m7.3 10 1.7 1.6 1.6-1.4" stroke-linecap="round"/></svg>`
};
const CARDS = [
  ['place','Localitat'], ['sky','Estat del cel'], ['temp','Temperatura'], ['feels','Sensació tèrmica'], ['hum','Humitat'],
  ['rain','Pluja'], ['fog','Boira'], ['snow','Neu'], ['alt','Altitud']
];
const ALERT = ['rain','fog','snow'];   // només es mostren si hi ha previsió
const wxTrack = document.getElementById('wxTrack'), wxDots = document.getElementById('wxDots');
function buildCards(){
  wxTrack.innerHTML = CARDS.map(([id,l]) =>
    `<div class="card${ALERT.includes(id)?' alert':''}" id="c-${id}" role="group" aria-label="${l}"${ALERT.includes(id)?' hidden':''}>
       <div class="c-ico">${ICO[id]||''}</div>
       <div class="c-val${id==='sky'||id==='place'?' txt':''}">—</div>
       <div class="c-lbl">${l}<span class="c-sub"></span></div>
     </div>`).join('');
  updateTrackUI();
}
const visibleCards = () => [...wxTrack.children].filter(c => !c.hidden);
function setCard(id, val, o={}){
  const c = document.getElementById('c-'+id); if (!c) return;
  const v = c.querySelector('.c-val'); v.textContent = val;
  v.classList.toggle('hot', !!o.hot);
  c.querySelector('.c-sub').textContent = o.sub || '';
  if (o.ico !== undefined) c.querySelector('.c-ico').innerHTML = o.ico;
}
function updateTrackUI(){
  const sl = wxTrack.scrollLeft, max = wxTrack.scrollWidth - wxTrack.clientWidth;
  wxTrack.style.setProperty('--fl', sl > 2 ? '22px' : '0px');
  wxTrack.style.setProperty('--fr', sl < max - 2 ? '22px' : '0px');
  const cards = visibleCards(), tr = wxTrack.getBoundingClientRect();
  if (wxDots.children.length !== cards.length) wxDots.innerHTML = cards.map(()=>'<i></i>').join('');
  [...wxDots.children].forEach((d,i) => {
    const r = cards[i] && cards[i].getBoundingClientRect();
    d.classList.toggle('on', !!r && r.left >= tr.left - r.width*.4 && r.right <= tr.right + r.width*.4);
  });
}
wxTrack.addEventListener('scroll', () => requestAnimationFrame(updateTrackUI), {passive:true});
window.addEventListener('resize', updateTrackUI);
// ratolí: arrossegar i roda
let tDrag = null;
wxTrack.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') return;
  tDrag = {x:e.clientX, sl:wxTrack.scrollLeft, moved:false};
  wxTrack.setPointerCapture(e.pointerId);
});
wxTrack.addEventListener('pointermove', e => {
  if (!tDrag) return;
  const dx = e.clientX - tDrag.x;
  if (Math.abs(dx) > 3){ tDrag.moved = true; wxTrack.classList.add('dragging'); }
  wxTrack.scrollLeft = tDrag.sl - dx;
});
const endDrag = () => {
  if (!tDrag) return; tDrag = null;
  wxTrack.classList.remove('dragging');           // en tornar el "snap", s'ajusta a la targeta més propera
};
wxTrack.addEventListener('pointerup', endDrag);
wxTrack.addEventListener('pointercancel', endDrag);
wxTrack.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && wxTrack.scrollWidth > wxTrack.clientWidth){
    e.preventDefault(); wxTrack.scrollBy({left: e.deltaY, behavior:'auto'});
  }
}, {passive:false});

function wxIcon(code, day, light){
  const L = light ? '#9fb043' : '#dfe8b2', LH = light ? '#e3eca8' : '#f5f8e2', LL = light ? '#7f8e2c' : '#a9b67a';
  const G1 = light ? '#aeb1b5' : '#9da0a4', G2 = light ? '#7f8388' : '#6a6d71', G3 = light ? '#55585d' : '#3f4246', R='#e3201b';
  const OL = light ? '#ffffff' : '#1b1c1f';
  const sun = (cx,cy,r)=>{ let rays=''; for(let i=0;i<8;i++){ const a=i*45; const [x1,y1]=P(r+6,a),[x2,y2]=P(r+13,a); rays+=`<line x1="${cx+x1}" y1="${cy+y1}" x2="${cx+x2}" y2="${cy+y2}" stroke="${L}" stroke-width="3.2" stroke-linecap="round"/>`; }
    return `<g${light?'':' filter="url(#wxGlow)"'}>${rays}<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#wxLume)"/></g>`; };
  const moon = (cx,cy,r)=>`<g${light?'':' filter="url(#wxGlow)"'}><path d="M${cx+r*.35},${cy-r} A${r},${r} 0 1 0 ${cx+r},${cy+r*.35} A${r*.8},${r*.8} 0 0 1 ${cx+r*.35},${cy-r} Z" fill="url(#wxLume)"/></g>`;
  const cloud = (dx,dy,s,fill)=>`<path transform="translate(${dx},${dy}) scale(${s})" d="M18,52 H70 A15,15 0 0 0 68,22 A21,21 0 0 0 28,26 A13,13 0 0 0 18,52 Z" fill="${fill}" stroke="${OL}" stroke-width="2"/>`;
  const drops = (n,col)=>{ let d=''; for(let i=0;i<n;i++){ const x=30+i*14; d+=`<line x1="${x}" y1="70" x2="${x-5}" y2="84" stroke="${col}" stroke-width="3.4" stroke-linecap="round"/>`; } return d; };
  const flakes = ()=>{ let d=''; for(const x of [32,48,64]){ d+=`<g transform="translate(${x},78)" stroke="${L}" stroke-width="2.4" stroke-linecap="round"><line x1="-6" y1="0" x2="6" y2="0"/><line x1="-3" y1="-5.2" x2="3" y2="5.2"/><line x1="-3" y1="5.2" x2="3" y2="-5.2"/></g>`; } return d; };
  const uid = 'w' + Math.random().toString(36).slice(2,7);
  const defs = `<defs><radialGradient id="wxLume" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="${LH}"/><stop offset=".6" stop-color="${L}"/><stop offset="1" stop-color="${LL}"/></radialGradient>
    <linearGradient id="wxCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${G1}"/><stop offset="1" stop-color="${G2}"/></linearGradient>
    <linearGradient id="wxCloudD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${G2}"/><stop offset="1" stop-color="${G3}"/></linearGradient>
    <filter id="wxGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`.replace(/(wxLume|wxCloudD|wxCloud|wxGlow)/g, '$1'+uid);
  const orb = (x,y,r)=> day ? sun(x,y,r) : moon(x,y,r);
  let body;
  if (code===0) body = orb(50,50,18);
  else if (code===1) body = orb(46,44,17) + cloud(26,34,.62,'url(#wxCloud)');
  else if (code===2) body = orb(36,36,14) + cloud(6,16,.95,'url(#wxCloud)');
  else if (code===3) body = cloud(-8,6,.8,'url(#wxCloudD)') + cloud(4,12,.95,'url(#wxCloud)');
  else if (isFogCode(code)) body = cloud(2,-2,.95,'url(#wxCloud)') + [66,76,86].map((y,i)=>`<line x1="${16+i*4}" y1="${y}" x2="${84-i*6}" y2="${y}" stroke="${G1}" stroke-width="3.4" stroke-linecap="round"/>`).join('');
  else if ((code>=51&&code<=67)||(code>=80&&code<=82)) body = cloud(2,0,.95,'url(#wxCloudD)') + drops(code<60?3:4, L);
  else if (isSnowCode(code)) body = cloud(2,0,.95,'url(#wxCloud)') + flakes();
  else if (code>=95) body = cloud(2,-2,.95,'url(#wxCloudD)') + `<path d="M52,50 L40,68 H50 L45,84 L63,62 H53 L59,50 Z" fill="${R}" stroke="#7a0e0b" stroke-width="1.5" stroke-linejoin="round"/>`;
  else body = cloud(2,6,.95,'url(#wxCloud)');
  body = body.replace(/(wxLume|wxCloudD|wxCloud|wxGlow)\)/g, '$1'+uid+')');
  const shift = code===0 ? 0 : (code===1||code===2) ? 6 : 12;
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${WX_TXT(code)}">${defs}<g transform="translate(0,${shift})">${body}</g></svg>`;
}

let geo = null, lastWx = null, sunTimes = null;
function locate(){
  return new Promise(res=>{
    if (!('geolocation' in navigator)) return res({...FALLBACK, fallback:true});
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lon:p.coords.longitude, alt:p.coords.altitude}),
      () => res({...FALLBACK, fallback:true}),
      {enableHighAccuracy:false, timeout:10000, maximumAge:15*60*1000}
    );
  });
}
const parseLocal = s => { const [d,t='00:00'] = s.split('T'); const [Y,M,D] = d.split('-').map(Number); const [h,m] = t.split(':').map(Number); return new Date(Y,M-1,D,h,m); };
const hh = s => s ? s.slice(11,13) : '';

function renderWeather(){
  const light = document.documentElement.dataset.theme === 'day';
  if (!lastWx){ setCard('sky', 'No disponible', {ico: wxIcon(3, true, light)}); return; }
  const c = lastWx.current, H = lastWx.hourly || {};
  setCard('sky', WX_TXT(c.weather_code), {ico: wxIcon(c.weather_code, c.is_day===1, light)});
  setCard('temp', `${Math.round(c.temperature_2m)}°`, {hot:true});
  setCard('feels', `${Math.round(c.apparent_temperature)}°`);
  setCard('hum', `${Math.round(c.relative_humidity_2m)}%`);
  // previsió de les properes 12 hores
  const T = H.time || [], PP = H.precipitation_probability || [], WC = H.weather_code || [], VIS = H.visibility || [], SN = H.snowfall || [];
  let pmax = -1, pAt = null, fogAt = null, snowAt = null;
  for (let i=0; i<T.length; i++){
    const p = PP[i];
    if (p != null && p > pmax){ pmax = p; pAt = T[i]; }
    if (!fogAt && (isFogCode(WC[i]) || (VIS[i] != null && VIS[i] < 1000))) fogAt = T[i];
    if (!snowAt && (isSnowCode(WC[i]) || (SN[i] || 0) > 0)) snowAt = T[i];
  }
  const nowH = T[0];
  const show = (id, on) => { const c = document.getElementById('c-'+id); if (c) c.hidden = !on; };
  const rainOn = pmax >= RAIN_MIN;
  show('rain', rainOn); show('fog', !!fogAt); show('snow', !!snowAt);
  if (rainOn) setCard('rain', `${pmax}%`, {sub: pAt===nowH ? 'ara mateix' : `màx. a les ${hh(pAt)} h`});
  if (fogAt)  setCard('fog',  fogAt===nowH  ? 'Ara' : `${hh(fogAt)} h`,  {sub: 'properes 12 h'});
  if (snowAt) setCard('snow', snowAt===nowH ? 'Ara' : `${hh(snowAt)} h`, {sub: 'properes 12 h'});
  setCard('place', geo.name || '—', {sub: geo.fallback ? ' · per defecte' : ''});
  const alt = (geo.alt!=null && isFinite(geo.alt)) ? geo.alt : lastWx.elevation;
  setCard('alt', alt!=null ? `${Math.round(alt)} m` : '—');
  updateTrackUI();
}

async function updateWeather(){
  try{
    if (!geo) geo = await locate();
    const {lat,lon} = geo;
    const [wx, place] = await Promise.all([
      fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
        + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day`
        + `&hourly=precipitation_probability,weather_code,visibility,snowfall&forecast_hours=12`
        + `&daily=sunrise,sunset&forecast_days=2&timezone=auto`),
      geo.name ? Promise.resolve(null)
               : fetchJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ca`).catch(()=>null)
    ]);
    if (!geo.name){ const n = place && (place.city || place.locality || place.principalSubdivision); if (n) geo.name = n; }
    lastWx = wx;
    if (wx.daily && wx.daily.sunrise) sunTimes = {rise: wx.daily.sunrise.map(parseLocal), set: wx.daily.sunset.map(parseLocal)};
    applyTheme();
    renderWeather();
  }catch(e){
    if (!lastWx){ renderWeather(); if (geo) setCard('place', geo.name || '—'); }
  }
}

/* =========================================================
   Mode diürn / nocturn: automàtic (sol) o manual
   ========================================================= */
const THEME_KEY = 'kostovTheme';
let themeMode = 'auto';
try{ themeMode = localStorage.getItem(THEME_KEY) || 'auto'; }catch(e){}
function isDayNow(){
  const n = new Date();
  if (sunTimes){
    for (let i=0; i<sunTimes.rise.length; i++){
      const r = sunTimes.rise[i], s = sunTimes.set[i];
      if (r.toDateString() === n.toDateString()) return n >= r && n < s;
    }
  }
  if (lastWx) return lastWx.current.is_day === 1;
  const h = n.getHours() + n.getMinutes()/60; return h >= 7.5 && h < 19.5;
}
function setNightLume(on){
  document.querySelectorAll('.lyr-hands .hl').forEach(el => {
    if (!el.dataset.f) el.dataset.f = el.getAttribute('fill');
    if (on){ el.setAttribute('fill',`url(#${el.dataset.n||'gHandLumeN'})`); el.setAttribute('filter',`url(#${el.dataset.g||'fLumeGlowH'})`); }
    else   { el.setAttribute('fill', el.dataset.f); el.removeAttribute('filter'); }
  });
}
function applyTheme(){
  const t = themeMode === 'auto' ? (isDayNow() ? 'day' : 'night') : themeMode;
  const root = document.documentElement, changed = root.dataset.theme !== t || !root.dataset.lumeSet;
  root.dataset.theme = t;
  if (changed){
    root.dataset.lumeSet = '1';
    setNightLume(t === 'night');
    renderWeather();
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'day' ? '#e4e5e0' : '#030304';
  }
  document.querySelectorAll('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === themeMode)));
}
document.getElementById('themeSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]'); if (!b) return;
  themeMode = b.dataset.mode;
  try{ localStorage.setItem(THEME_KEY, themeMode); }catch(e){}
  applyTheme();
});

/* =========================================================
   App instal·lable: service worker (funciona sense connexió) i botó d'instal·lar
   ========================================================= */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker:', err)));
}
(function initInstall(){
  const btn = document.getElementById('installBtn'), hint = document.getElementById('iosHint');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if (!standalone) btn.hidden = false; });
  // a l'iPhone no hi ha avís automàtic: el botó mostra com fer-ho des de Safari
  if (isIOS && !standalone && location.protocol.startsWith('http')) btn.hidden = false;
  btn.addEventListener('click', async () => {
    if (deferred){ deferred.prompt(); await deferred.userChoice.catch(()=>{}); deferred = null; btn.hidden = true; }
    else if (isIOS) hint.hidden = !hint.hidden;
  });
  hint.addEventListener('click', () => hint.hidden = true);
  window.addEventListener('appinstalled', () => { btn.hidden = true; hint.hidden = true; });
})();

/* =========================================================
   Arrencada
   ========================================================= */
buildBase(); buildBezel(); buildGlow(); buildHands(); setupBezel();
buildBackDial(); buildBackBezel(); buildBackGlow(); buildBackHands();
setupBezel('bBezel','bezelHitB','bezelRotB','glowPipB');
initFlip(); initReserve();
const hSec = document.getElementById('hSec'), hMin = document.getElementById('hMin'), hHour = document.getElementById('hHour');
const hSecB = document.getElementById('hSecB'), hMinB = document.getElementById('hMinB'), hHourB = document.getElementById('hHourB');
buildCards();
applyTheme();
renderCalendar();
requestAnimationFrame(tick);
refreshHolidays(false);
setInterval(()=>refreshHolidays(true), REFRESH_MS);
updateWeather();
setInterval(updateWeather, 15*60*1000);
setInterval(applyTheme, 60*1000);
</script>
