<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rellotge estil estació suïssa - Tablet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #f4f2ec;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 4rem 2.5rem 2.5rem;
    box-sizing: border-box;
    min-height: 100vh;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    width: 100%;
    max-width: 460px;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
  }
  .clock-case {
    background: #1c1c1c;
    border-radius: 50%;
    padding: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.18);
  }
  #clock {
    width: min(42vw, 420px);
    height: min(42vw, 420px);
    display: block;
  }
  #digital {
    font-size: 30px;
    font-weight: 600;
    color: #1c1c1c;
  }
  #calHeader {
    text-align: center;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 18px;
    color: #1c1c1c;
    text-transform: capitalize;
  }
  #calGrid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 12px;
    text-align: center;
    font-size: 24px;
    width: 100%;
    color: #1c1c1c;
  }
  #calGrid div { padding: 9px 0; border-radius: 8px; }
  .dow { font-size: 19px; letter-spacing: 0.5px; color: #9a9a94; font-weight: 600; }
  .today { background: #d0102a; color: #ffffff; font-weight: 600; }

  /* En pantalles més amples (tauleta en horitzontal), rellotge i calendari en línia */
  @media (min-width: 900px) {
    .wrap {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      max-width: 1000px;
      gap: 5rem;
    }
    .col { width: auto; }
    #calGrid { min-width: 400px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="col">
    <div class="clock-case">
      <svg id="clock" viewBox="0 0 200 200" role="img" aria-label="Rellotge estil estació suïssa">
        <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="#1c1c1c" stroke-width="2"/>
        <g id="ticks"></g>
        <text x="100" y="52" text-anchor="middle" font-family="'Mondaine Helvetica', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#1c1c1c">DOMAINE</text>
        <g id="swissLogo">
          <rect x="93" y="58" width="14" height="14" fill="#d52b1e"/>
          <rect x="95" y="63" width="10" height="4" fill="#ffffff"/>
          <rect x="98" y="60" width="4" height="10" fill="#ffffff"/>
        </g>
        <text id="tempText" x="100" y="152" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#1c1c1c">--°C</text>
        <line id="hourHand" x1="100" y1="118" x2="100" y2="37" stroke="#1c1c1c" stroke-width="8.43" stroke-linecap="butt"/>
        <polygon id="minHand" points="96.07,118 96.07,100 96.33,18 103.68,18 103.93,100 103.93,118" fill="#1c1c1c"/>
        <g id="secGroup">
          <line x1="100" y1="118" x2="100" y2="30" stroke="#d0102a" stroke-width="2"/>
          <circle cx="100" cy="37" r="7" fill="#d0102a"/>
        </g>
        <circle cx="100" cy="100" r="5" fill="#1c1c1c"/>
      </svg>
    </div>
    <div id="digital">--:--:--</div>
  </div>

  <div class="col" style="align-items: stretch;">
    <div id="calHeader">--</div>
    <div id="calGrid"></div>
  </div>

</div>

<script>
(function(){
  var svgNS = "http://www.w3.org/2000/svg";
  var ticks = document.getElementById('ticks');
  for (var i = 0; i < 60; i++) {
    var angle = i * 6 * Math.PI / 180;
    var isHour = i % 5 === 0;
    var r1 = isHour ? 72 : 84;
    var w = isHour ? 6 : 3;
    var len = isHour ? 20 : 8;
    var x1 = 100 + r1 * Math.sin(angle), y1 = 100 - r1 * Math.cos(angle);
    var x2 = 100 + (r1 + len) * Math.sin(angle), y2 = 100 - (r1 + len) * Math.cos(angle);
    var line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', '#1c1c1c');
    line.setAttribute('stroke-width', w);
    ticks.appendChild(line);
  }

  var diesSetmana = ["dl","dt","dc","dj","dv","ds","dg"];
  var diesLlarg = ["diumenge","dilluns","dimarts","dimecres","dijous","divendres","dissabte"];
  var mesos = ["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];

  function buildCalendar(now) {
    var year = now.getFullYear(), month = now.getMonth(), today = now.getDate();
    document.getElementById('calHeader').textContent = mesos[month] + " " + year;
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    diesSetmana.forEach(function(d){
      var el = document.createElement('div');
      el.textContent = d;
      el.className = 'dow';
      grid.appendChild(el);
    });
    var firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    for (var i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));
    for (var d = 1; d <= daysInMonth; d++) {
      var cell = document.createElement('div');
      cell.textContent = d;
      if (d === today) cell.className = 'today';
      grid.appendChild(cell);
    }
  }

  var lastDay = null;
  var lastDigitalSecond = null;

  function frame() {
    var now = new Date();
    var h = now.getHours() % 12, m = now.getMinutes();
    var s = now.getSeconds();
    var ms = now.getMilliseconds();
    var sFrac = s + ms / 1000;

    var sAngle;
    if (sFrac < 58) {
      sAngle = (sFrac / 58) * 360;
    } else {
      sAngle = 360;
    }

    var mAngle = m * 6;
    var hAngle = (h + m / 60) * 30;

    document.getElementById('hourHand').setAttribute('transform', 'rotate(' + hAngle + ' 100 100)');
    document.getElementById('minHand').setAttribute('transform', 'rotate(' + mAngle + ' 100 100)');
    document.getElementById('secGroup').setAttribute('transform', 'rotate(' + sAngle + ' 100 100)');

    if (s !== lastDigitalSecond) {
      lastDigitalSecond = s;
      var pad = function(n){ return n < 10 ? '0' + n : n; };
      document.getElementById('digital').textContent = pad(now.getHours()) + ':' + pad(m) + ':' + pad(s);

      if (lastDay !== now.getDate()) {
        lastDay = now.getDate();
        buildCalendar(now);
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* Temperatura actual, a partir de la geolocalització del dispositiu i l'API pública Open-Meteo (sense clau) */
  var tempEl = document.getElementById('tempText');
  var lastCoords = null;

  function fetchTemperature(lat, lon) {
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data && data.current_weather) {
          var t = Math.round(data.current_weather.temperature);
          tempEl.textContent = t + '°C';
        }
      })
      .catch(function(){ /* si falla la xarxa, es manté el darrer valor conegut */ });
  }

  function requestLocationAndTemp() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      function(pos){
        lastCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        fetchTemperature(lastCoords.lat, lastCoords.lon);
      },
      function(){ /* permís denegat o error: es manté "--°C" */ },
      { timeout: 10000, maximumAge: 600000 }
    );
  }

  requestLocationAndTemp();
  setInterval(function(){
    if (lastCoords) fetchTemperature(lastCoords.lat, lastCoords.lon);
    else requestLocationAndTemp();
  }, 15 * 60 * 1000); /* refresc cada 15 minuts */
})();
</script>

</body>
</html>
